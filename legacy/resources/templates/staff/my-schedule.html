<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="card mb-4 today-shift-card">
                <div class="card-body d-flex flex-wrap gap-3 align-items-center">
                    <div class="fs-2 text-primary"><i class="bi bi-fingerprint"></i></div>
                    <div class="flex-grow-1">
                        <div class="fw-semibold">Ca hôm nay</div>
                        <div th:if="${todayShifts.isEmpty()}" class="text-muted small">Hôm nay bạn không có ca làm.</div>
                        <div th:each="a : ${todayShifts}" class="small">
                            <span class="fw-semibold" th:text="${a.shift.name}"></span> <span th:text="${a.shift.timeRange}"></span>
                            <span class="badge ms-1" th:classappend="'text-bg-' + ${a.attendance[1]}" th:text="${a.attendance[0]}"></span>
                            <span class="text-muted" th:if="${a.checkInAt != null}" th:text="' · vào ' + ${#temporals.format(a.checkInAt, 'HH:mm')}"></span>
                            <span class="text-muted" th:if="${a.checkOutAt != null}" th:text="' · ra ' + ${#temporals.format(a.checkOutAt, 'HH:mm')}"></span>
                        </div>
                    </div>
                    <form th:action="@{/staff/check-in}" method="post"><button class="btn btn-success"><i class="bi bi-box-arrow-in-right"></i> Vào ca</button></form>
                    <form th:action="@{/staff/check-out}" method="post"><button class="btn btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Kết thúc ca</button></form>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/staff/my-schedule(week=${monday.minusWeeks(1)})}"><i class="bi bi-chevron-left"></i></a>
                <span class="fw-semibold" th:text="'Tuần ' + ${#temporals.format(monday, 'dd/MM')} + ' - ' + ${#temporals.format(monday.plusDays(6), 'dd/MM/yyyy')}"></span>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/staff/my-schedule(week=${monday.plusWeeks(1)})}"><i class="bi bi-chevron-right"></i></a>
                <span class="small text-muted ms-2" th:text="'Tổng ' + ${#numbers.formatDecimal(weekMinutes / 60.0, 1, 1)} + ' giờ theo lịch'"></span>
                <a th:href="@{/staff/my-payslips}" class="btn btn-sm btn-outline-primary ms-auto"><i class="bi bi-wallet2"></i> Phiếu lương</a>
            </div>
            <div class="row row-cols-1 row-cols-md-7 g-2 week-grid">
                <div class="col" th:each="d, ds : ${days}">
                    <div class="card h-100" th:classappend="${d == today} ? 'border-primary'">
                        <div class="card-header py-1 small text-center" th:classappend="${d == today} ? 'text-bg-primary'">
                            <span th:text="${dayNames[ds.index]}"></span> <span th:text="${#temporals.format(d, 'dd/MM')}"></span></div>
                        <div class="card-body p-2">
                            <div th:each="a : ${shifts}" th:if="${a.workDate == d}" class="shift-chip mb-1" th:classappend="'border-' + ${a.shift.color}">
                                <div class="fw-semibold small" th:classappend="'text-' + ${a.shift.color}" th:text="${a.shift.name}"></div>
                                <div class="small text-muted" th:text="${a.shift.timeRange}"></div>
                                <span class="badge" th:classappend="'text-bg-' + ${a.attendance[1]}" th:text="${a.attendance[0]}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
