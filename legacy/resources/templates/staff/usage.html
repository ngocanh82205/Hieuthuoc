<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-white">
<main class="container py-4 print-page" th:with="o=${order}">
    <div class="text-center mb-3">
        <div class="fw-bold fs-5" th:text="${settings['store_name']}"></div>
        <h1 class="h4 fw-bold mt-2">HƯỚNG DẪN SỬ DỤNG THUỐC</h1>
        <div class="small" th:text="'Đơn hàng ' + ${o.code} + ' · ' + ${o.recipient} + ' · ' + ${@fmt.date(o.createdAt)}"></div>
    </div>
    <div class="alert alert-warning small" th:if="${o.latestPrescription != null && o.latestPrescription.pharmacistNote != null}">
        <strong>Lời dặn của dược sĩ:</strong> <span th:text="${o.latestPrescription.pharmacistNote}"></span></div>
    <div class="border rounded p-3 mb-3" th:each="it, st : ${o.items}">
        <div class="d-flex justify-content-between">
            <div class="fw-bold" th:text="${st.count} + '. ' + ${it.productName}"></div>
            <div class="small" th:text="${it.quantity} + ' ' + ${it.unit}"></div>
        </div>
        <div class="small text-muted" th:text="${it.product.activeIngredient ?: ''} + ' ' + ${it.product.strength ?: ''}"></div>
        <div class="small mt-1"><strong>Cách dùng:</strong> <span th:text="${it.product.usageInstruction ?: 'Theo chỉ dẫn của bác sĩ/dược sĩ.'}"></span></div>
        <div class="small" th:if="${it.product.contraindications != null}"><strong>Không dùng khi:</strong> <span th:text="${it.product.contraindications}"></span></div>
        <div class="small" th:if="${it.product.sideEffects != null}"><strong>Tác dụng phụ có thể gặp:</strong> <span th:text="${it.product.sideEffects}"></span></div>
        <div class="small text-muted" th:each="a : ${it.allocations}" th:text="'Số lô ' + ${a.batch.batchNo} + ' - HSD ' + ${@fmt.date(a.batch.expDate)}"></div>
    </div>
    <p class="small text-muted">Đọc kỹ hướng dẫn sử dụng trước khi dùng. Nếu có bất thường, ngừng thuốc và liên hệ dược sĩ qua hotline
        <strong th:text="${settings['store_phone']}"></strong>.</p>
    <div class="text-center mt-4 no-print"><button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> In</button></div>
</main>
</body>
</html>
