<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status != null ? 'Lỗi ' + status : 'Lỗi'}">Lỗi</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="card mx-auto text-center" style="max-width: 520px">
        <div class="card-body p-5">
            <div class="display-4 text-primary mb-2">
                <i class="bi" th:classappend="${status == 404} ? 'bi-search' : (${status == 403} ? 'bi-shield-lock' : 'bi-exclamation-circle')"></i>
            </div>
            <h1 class="h4" th:text="${status == 404} ? 'Không tìm thấy trang' : (${status == 403} ? 'Không có quyền truy cập' : 'Đã có lỗi xảy ra')">Lỗi</h1>
            <p class="text-muted" th:text="${message != null && !#strings.isEmpty(message) && status != 500} ? ${message} : 'Vui lòng thử lại hoặc quay về trang chủ.'">Mô tả</p>
            <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Về trang chủ</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại</a>
        </div>
    </div>
</main>
</body>
</html>
