<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form class="card card-body mb-3" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3"><label class="form-label small">Nhân viên</label>
                        <select name="userId" class="form-select form-select-sm"><option value="">Tất cả</option>
                            <option th:each="u : ${staff}" th:value="${u.id}" th:text="${u.fullName}" th:selected="${userId == u.id}"></option></select></div>
                    <div class="col-md-2"><label class="form-label small">Nhóm hành động</label>
                        <select name="action" class="form-select form-select-sm"><option value="">Tất cả</option>
                            <option th:each="a : ${actions}" th:value="${a}" th:text="${a}" th:selected="${action == a}"></option></select></div>
                    <div class="col-md-3"><label class="form-label small">Nội dung chứa</label><input name="q" th:value="${q}" class="form-control form-control-sm" placeholder="Mã đơn, email, tên thuốc..."></div>
                    <div class="col-md-2"><label class="form-label small">Từ ngày</label><input type="date" name="from" th:value="${from}" class="form-control form-control-sm"></div>
                    <div class="col-md-2"><label class="form-label small">Đến ngày</label><input type="date" name="to" th:value="${to}" class="form-control form-control-sm"></div>
                    <div class="col-12"><button class="btn btn-sm btn-primary"><i class="bi bi-funnel"></i> Lọc</button>
                        <a th:href="@{/admin/logs}" class="btn btn-sm btn-link">Xóa lọc</a>
                        <span class="small text-muted ms-2" th:text="${page.totalElements} + ' bản ghi'"></span></div>
                </div>
            </form>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Chi tiết</th></tr></thead>
                        <tbody>
                        <tr th:each="l : ${page.content}">
                            <td class="small text-nowrap" th:text="${@fmt.dateTime(l.createdAt)}"></td>
                            <td class="small"><span th:text="${l.user != null ? l.user.fullName : 'Hệ thống'}"></span>
                                <span th:if="${l.user != null}" class="text-muted" th:text="'(' + ${l.user.positionLabel} + ')'"></span></td>
                            <td><code th:text="${l.action}"></code></td>
                            <td class="small" th:text="${l.detail}"></td>
                        </tr>
                        <tr th:if="${page.content.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">Không có bản ghi.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav th:replace="~{fragments/layout :: pagination(${page})}"></nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
