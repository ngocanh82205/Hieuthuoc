<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form class="card card-body mb-3 d-flex flex-row gap-2" method="get" th:action="@{/admin/customers}">
                <input name="q" class="form-control" th:value="${q}" placeholder="Tìm theo tên, email, số điện thoại">
                <button class="btn btn-primary">Tìm</button>
            </form>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Khách hàng</th><th>Liên hệ</th><th>Ngày đăng ký</th><th class="text-end">Số đơn</th><th class="text-end">Đã chi tiêu</th><th class="text-end">Điểm</th><th>Trạng thái</th></tr></thead>
                        <tbody>
                        <tr th:if="${page.empty}"><td colspan="7" class="text-center text-muted py-4">Không có khách hàng.</td></tr>
                        <tr th:each="c : ${page.content}">
                            <td><a class="fw-semibold" th:href="@{/admin/customers/{id}(id=${c.id})}" th:text="${c.fullName}"></a></td>
                            <td class="small" th:text="${c.phone} + (${c.email != null} ? ' · ' + ${c.email} : '')"></td>
                            <td class="small" th:text="${@fmt.date(c.createdAt)}"></td>
                            <td class="text-end" th:text="${orders[c.id]}"></td>
                            <td class="text-end" th:text="${@fmt.money(spent[c.id])}"></td>
                            <td class="text-end" th:text="${c.points}"></td>
                            <td><span class="badge" th:classappend="${c.locked} ? 'text-bg-danger' : 'text-bg-success'" th:text="${c.locked} ? 'Đã khóa' : 'Hoạt động'"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav th:replace="~{fragments/layout :: pagination(${page})}"></nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
