<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-4">
    <div class="row g-4">
        <aside class="col-lg-3"><div th:replace="~{fragments/layout :: accountMenu}"></div></aside>
        <section class="col-lg-9">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="d-flex flex-wrap gap-2 mb-3 filter-chips">
                <a th:href="@{/account/orders}" class="btn btn-sm" th:classappend="${status == null} ? 'btn-primary' : 'btn-outline-secondary'">Tất cả</a>
                <a th:each="s : ${statuses}" th:href="@{/account/orders(status=${s})}" class="btn btn-sm"
                   th:classappend="${status == s} ? 'btn-primary' : 'btn-outline-secondary'" th:text="${s.label}"></a>
            </div>
            <div th:if="${orders.isEmpty()}" class="card card-body text-center text-muted py-5">
                <i class="bi bi-receipt fs-1"></i><p class="mt-2 mb-0">Chưa có đơn hàng.</p>
            </div>
            <div class="card mb-3" th:each="o : ${orders}">
                <div class="card-body d-flex flex-wrap justify-content-between gap-3">
                    <div>
                        <div class="fw-semibold"><a th:href="@{/account/orders/{c}(c=${o.code})}" th:text="${o.code}"></a>
                            <span th:replace="~{fragments/staff :: orderStatus(${o.status})}"></span>
                            <span th:if="${o.returnStatus != null}" class="badge" th:classappend="'text-bg-' + ${o.returnStatus.color}" th:text="${o.returnStatus.label}"></span>
                        </div>
                        <div class="small text-muted" th:text="${@fmt.dateTime(o.createdAt)} + ' · ' + ${o.items.size()} + ' sản phẩm'"></div>
                        <div class="small" th:text="${#strings.listJoin(o.items.![productName], ', ')}"></div>
                    </div>
                    <div class="text-end">
                        <div class="price" th:text="${@fmt.money(o.total)}"></div>
                        <span class="badge" th:classappend="'text-bg-' + ${o.paymentStatus.color}" th:text="${o.paymentStatus.label}"></span>
                        <div class="mt-2"><a th:href="@{/account/orders/{c}(c=${o.code})}" class="btn btn-sm btn-outline-primary">Chi tiết</a></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
