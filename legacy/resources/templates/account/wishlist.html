<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-4">
    <div class="row g-4">
        <aside class="col-lg-3"><div th:replace="~{fragments/layout :: accountMenu}"></div></aside>
        <section class="col-lg-9">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <h1 class="h5 fw-bold mb-3"><i class="bi bi-heart-fill text-danger me-1"></i>Sản phẩm yêu thích</h1>
            <div th:if="${products.isEmpty()}" class="card card-body text-center text-muted py-5">
                <i class="bi bi-heart fs-1"></i><p class="mt-2 mb-0">Chưa có sản phẩm yêu thích. Nhấn biểu tượng trái tim trên sản phẩm để lưu lại.</p>
            </div>
            <div class="row row-cols-2 row-cols-md-3 g-3 mb-4">
                <div class="col" th:each="p : ${products}"><div th:replace="~{fragments/layout :: productCard(${p})}"></div></div>
            </div>
            <div class="card">
                <div class="card-header"><i class="bi bi-bell me-1 text-primary"></i>Đang chờ có hàng trở lại</div>
                <ul class="list-group list-group-flush">
                    <li th:if="${subscriptions.isEmpty()}" class="list-group-item text-muted small">Bạn chưa đăng ký nhận thông báo cho sản phẩm nào.</li>
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="s : ${subscriptions}">
                        <div><a th:href="@{/products/{sl}(sl=${s.product.slug})}" class="fw-semibold" th:text="${s.product.name}"></a>
                            <div class="small text-muted" th:text="'Đăng ký lúc ' + ${@fmt.dateTime(s.createdAt)}"></div></div>
                        <form th:action="@{/stock-alert/{id}(id=${s.product.id})}" method="post">
                            <input type="hidden" name="cancel" value="true">
                            <button class="btn btn-sm btn-outline-secondary">Hủy</button></form>
                    </li>
                </ul>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
