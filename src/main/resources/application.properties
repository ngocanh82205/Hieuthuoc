spring.application.name=hieuthuoc
server.port=${PORT:8080}

# Mặc định dùng H2 (file ./data/hieuthuoc) - không cần cài database.
# Muốn dùng MySQL: chạy với profile mysql (xem application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/hieuthuoc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=20MB

spring.thymeleaf.cache=false
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false

# Thư mục lưu ảnh upload (ảnh sản phẩm, đơn thuốc, chat)
app.upload-dir=uploads
# Tự tạo dữ liệu mẫu khi database trống
app.seed-demo-data=true
