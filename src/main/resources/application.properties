spring.application.name=hieuthuoc
server.port=${PORT:8080}

# Cấu hình kết nối MySQL XAMPP (Database: Hieuthuoc)
spring.datasource.url=jdbc:mysql://localhost:3306/Hieuthuoc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình H2 dự phòng (nếu không dùng MySQL thì bỏ comment):
# spring.datasource.url=jdbc:h2:file:./data/hieuthuoc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
# spring.datasource.username=sa
# spring.datasource.password=

# Dùng chung CSDL với bản Laravel: KHÔNG để Hibernate tự sửa bảng (bảng do migration Laravel tạo)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=20MB

spring.thymeleaf.cache=false
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false

# Địa chỉ gốc của website (dùng trong email, URL trả về của cổng thanh toán)
app.url=${APP_URL:http://localhost:8080}
app.env=${APP_ENV:local}

# Thư mục lưu file upload: public/ (ảnh sản phẩm, bài viết - phục vụ tại /storage/...),
# private/ (ảnh đơn thuốc, ảnh chat - chỉ xem qua /files/...)
app.storage-root=${STORAGE_ROOT:storage/app}
# Tự tạo dữ liệu mẫu khi database trống
app.seed-demo-data=true

# Trợ lý AI tiếp nhận chat (Gemini hoặc Claude). Không có key: trợ lý trả lời theo kịch bản
# và vẫn chuyển dược sĩ đúng quy tắc.
app.ai.gemini-key=${GEMINI_API_KEY:}
app.ai.anthropic-key=${ANTHROPIC_API_KEY:}

# Email: mailer=log chỉ ghi log; mailer=smtp gửi thật qua spring.mail.*
app.mail.mailer=${MAIL_MAILER:log}

# Cổng thanh toán, vận chuyển (để trống = chế độ thử nghiệm)
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.ghn.token=${GHN_TOKEN:}
app.ghn.shop-id=${GHN_SHOP_ID:}
app.ghn.from-district-id=${GHN_FROM_DISTRICT_ID:}
app.ghn.from-ward-code=${GHN_FROM_WARD_CODE:}
app.ghn.webhook-secret=${GHN_WEBHOOK_SECRET:}
server.servlet.session.tracking-modes=cookie

# REST API: khóa ký access token (JWT HS256) và thời hạn token
app.api.secret=${API_SECRET:hieuthuoc-api-dev-secret-change-me}
app.api.token-ttl-hours=${API_TOKEN_TTL_HOURS:24}
