spring.application.name=hieuthuoc
server.port=${PORT:8080}

# Cấu hình kết nối MySQL XAMPP (Database: Hieuthuoc)
spring.datasource.url=jdbc:mysql://localhost:3306/Hieuthuoc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình H2 dự phòng (nếu không dùng MySQL thì bỏ comment):
# spring.datasource.url=jdbc:h2:file:./data/hieuthuoc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
# spring.datasource.username=sa
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=20MB

spring.thymeleaf.cache=false
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false

# Thư mục lưu ảnh upload (ảnh sản phẩm, đơn thuốc, chat)
app.upload-dir=uploads
# Tự tạo dữ liệu mẫu khi database trống
app.seed-demo-data=true
