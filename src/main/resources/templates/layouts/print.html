<!DOCTYPE html>
<!--/* Layout trang in (hóa đơn, phiếu giao hàng...). Trang dùng: th:replace="~{layouts/print :: layout(~{::content})}" */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <th:block th:replace="~{partials/head :: head}"/>
</head>
<body class="bg-white">
<main class="container py-4 print-page" style="max-width: 820px">
    <th:block th:replace="${content}"/>
    <div class="text-center mt-4 no-print">
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> In</button>
        <button class="btn btn-light" onclick="window.close()">Đóng</button>
    </div>
</main>
</body>
</html>
