<!DOCTYPE html>
<!--/* Layout khu vực nhân viên / quản trị. Trang dùng: th:replace="~{layouts/admin :: layout(~{::content}, ~{})}" */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, scripts)">
<head>
    <th:block th:replace="~{partials/head :: head}"/>
</head>
<body class="staff-body">
<div class="staff-shell">
    <th:block th:replace="~{partials/sidebar :: sidebar}"/>
    <div class="staff-main">
        <header class="staff-topbar">
            <button class="btn btn-light d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#staffSidebar" aria-label="Mở menu">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="h5 mb-0 text-truncate" th:text="${title} ?: 'Trang quản lý'">Trang quản lý</h1>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/}" class="btn btn-sm btn-light" target="_blank" title="Xem website"><i class="bi bi-shop"></i><span class="d-none d-md-inline ms-1">Website</span></a>
                <a th:href="@{/notifications}" class="btn btn-sm btn-light position-relative" aria-label="Thông báo">
                    <i class="bi bi-bell"></i>
                    <span th:if="${unreadCount > 0}" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle" th:text="${unreadCount}"></span>
                </a>
                <div class="dropdown">
                    <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span class="d-none d-md-inline" th:text="${currentUser.fullName}"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text small text-muted" th:text="${currentUser.positionLabel()}"></span></li>
                        <li><a class="dropdown-item" th:href="@{/staff/profile}"><i class="bi bi-key me-2"></i>Đổi mật khẩu</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
        <main class="p-3 p-lg-4">
            <th:block th:replace="~{partials/flash :: flash}"/>
            <th:block th:replace="~{partials/section-tabs :: tabs}"/>
            <th:block th:replace="${content}"/>
        </main>
    </div>
</div>
<th:block th:replace="~{partials/scripts :: scripts}"/>
<th:block th:replace="${scripts}"/>
</body>
</html>
