<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <h1 class="h4 fw-bold mb-3">Góc sức khỏe</h1>
    <p th:if="${posts.isEmpty()}" class="text-muted">Chưa có bài viết.</p>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="post, st : ${posts.items}"><th:block th:replace="~{shop/_post-card :: card(${post}, ${st.index})}"/></div>
    </div>
    <div class="mt-4"><th:block th:replace="~{partials/pagination :: links(${posts})}"/></div>
</th:block>
</body>
</html>
