<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item active" th:text="${page.title}"></li>
        </ol>
    </nav>
    <div class="row g-4">
        <div class="col-lg-8">
            <article class="card static-page">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold mb-1" th:text="${page.title}"></h1>
                    <div class="small text-muted mb-3" th:text="'Cập nhật ' + ${@h.date(page.updatedAt)}"></div>
                    <div th:with="html=${@h.md(page.content)}" th:utext="${html}"></div>
                </div>
            </article>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">Thông tin &amp; chính sách</div>
                <div class="list-group list-group-flush">
                    <a th:each="pg : ${footerPages}" th:href="@{/pages/{s}(s=${pg.slug})}"
                       th:class="'list-group-item list-group-item-action ' + (${pg.slug == page.slug} ? 'active' : '')" th:text="${pg.title}"></a>
                    <a th:href="@{/faq}" class="list-group-item list-group-item-action">Câu hỏi thường gặp</a>
                </div>
            </div>
            <div class="card mt-3">
                <div class="card-body small">
                    <div class="fw-semibold mb-1" th:text="${settings['store_name']}"></div>
                    <div th:text="${settings['business_license']}"></div>
                    <div th:text="${settings['gpp_cert']}"></div>
                    <div th:text="'Dược sĩ phụ trách chuyên môn: ' + ${settings['pharmacist_in_charge']}"></div>
                    <div th:text="'Hotline: ' + ${settings['store_phone']}"></div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
