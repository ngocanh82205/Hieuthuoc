<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-4">
        <article class="col-lg-8">
            <div class="card">
                <img th:if="${post.imageUrl() != null}" th:src="${post.imageUrl()}" class="card-img-top" th:alt="${post.title}" style="max-height:340px;object-fit:cover">
                <div class="card-body p-md-5">
                    <a th:href="@{/posts}" class="small"><i class="bi bi-arrow-left"></i> Góc sức khỏe</a>
                    <h1 class="h3 fw-bold mt-2" th:text="${post.title}"></h1>
                    <div class="small text-muted mb-4 d-flex flex-wrap align-items-center gap-2">
                        <span><th:block th:text="${@h.date(post.createdAt)}"/><th:block th:if="${post.author != null}" th:text="' · ' + ${post.author.fullName}"/></span>
                        <th:block th:with="shareUrl=${@h.abs('/posts/' + post.slug)}"><th:block th:replace="~{partials/misc :: share(${shareUrl}, ${post.title}, '')}"/></th:block>
                    </div>
                    <p th:if="${post.summary != null}" class="lead" th:text="${post.summary}"></p>
                    <div class="static-page" th:with="html=${@h.md(post.content)}" th:utext="${html}"></div>
                </div>
            </div>
        </article>
        <aside class="col-lg-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="h6 fw-semibold"><i class="bi bi-chat-dots text-primary"></i> Cần tư vấn thêm?</h2>
                    <p class="small text-muted">Dược sĩ của chúng tôi sẵn sàng giải đáp thắc mắc về thuốc và sức khỏe.</p>
                    <a th:href="@{/consult}" class="btn btn-primary btn-sm">Chat với dược sĩ</a>
                </div>
            </div>
            <div th:if="${!others.isEmpty()}" class="card">
                <div class="card-header">Bài viết khác</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="o : ${others}"><a th:href="@{/posts/{s}(s=${o.slug})}" th:text="${o.title}"></a></li>
                </ul>
            </div>
        </aside>
    </div>
</th:block>
</body>
</html>
