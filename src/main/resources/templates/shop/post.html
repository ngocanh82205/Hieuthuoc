<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-4">
    <div class="row g-4">
        <article class="col-lg-8">
            <div class="card">
                <div class="card-body p-md-5">
                    <a th:href="@{/posts}" class="small"><i class="bi bi-arrow-left"></i> Góc sức khỏe</a>
                    <h1 class="h3 fw-bold mt-2" th:text="${post.title}"></h1>
                    <div class="small text-muted mb-4">
                        <span th:text="${@fmt.date(post.createdAt)}"></span>
                        <span th:if="${post.author != null}" th:text="' · ' + ${post.author.fullName}"></span>
                    </div>
                    <p class="lead" th:if="${post.summary != null}" th:text="${post.summary}"></p>
                    <p th:each="para : ${post.paragraphs}" th:text="${para}"></p>
                </div>
            </div>
        </article>
        <aside class="col-lg-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="h6 fw-semibold"><i class="bi bi-chat-dots text-primary"></i> Cần tư vấn thêm?</h2>
                    <p class="small text-muted">Dược sĩ của chúng tôi sẵn sàng giải đáp thắc mắc về thuốc và sức khỏe.</p>
                    <a th:href="@{/consult}" class="btn btn-primary btn-sm">Chat với dược sĩ</a>
                </div>
            </div>
            <div class="card" th:if="${!others.isEmpty()}">
                <div class="card-header">Bài viết khác</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="o : ${others}"><a th:href="@{/posts/{s}(s=${o.slug})}" th:text="${o.title}"></a></li>
                </ul>
            </div>
        </aside>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
