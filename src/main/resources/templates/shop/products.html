<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li th:each="c, st : ${categoryPath}" th:class="'breadcrumb-item ' + (${st.last} ? 'active' : '')">
                <th:block th:if="${st.last}" th:text="${c.name}"/>
                <a th:unless="${st.last}" th:href="@{/products(category=${c.slug})}" th:text="${c.name}"></a>
            </li>
            <li th:if="${categoryPath.isEmpty()}" class="breadcrumb-item active" th:text="${title}"></li>
        </ol>
    </nav>
    <div class="row g-4">
        <aside class="col-lg-3">
            <form th:action="@{/products}" method="get" class="card">
                <div class="card-header">Bộ lọc</div>
                <div class="card-body">
                    <input type="hidden" name="q" th:value="${q}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Danh mục</label>
                        <select name="category" class="form-select form-select-sm" data-autosubmit>
                            <option value="">Tất cả</option>
                            <option th:each="c : ${navCategories}" th:value="${c.slug}" th:selected="${category != null and category.id == c.id}"
                                    th:text="${#strings.repeat('— ', c.depth) + c.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Loại sản phẩm</label>
                        <select name="type" class="form-select form-select-sm" data-autosubmit>
                            <option value="">Tất cả</option>
                            <option th:each="t : ${drugTypes}" th:value="${t.name()}" th:selected="${type == t}" th:text="${t.label}"></option>
                        </select>
                    </div>
                    <div class="mb-3" th:each="f : ${ { {'brand', 'Thương hiệu / nhà sản xuất'}, {'country', 'Xuất xứ'}, {'form', 'Dạng bào chế'} } }"
                         th:with="options=${f[0] == 'brand' ? brands : (f[0] == 'country' ? countries : forms)}">
                        <label class="form-label small fw-semibold" th:text="${f[1]}"></label>
                        <select th:name="${f[0]}" class="form-select form-select-sm" data-autosubmit>
                            <option value="">Tất cả</option>
                            <option th:each="o : ${options}" th:value="${o}" th:selected="${@h.param(f[0]) == o}" th:text="${o}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Khoảng giá (đ)</label>
                        <div class="d-flex gap-2">
                            <input type="number" name="min" min="0" step="1000" class="form-control form-control-sm" placeholder="Từ" th:value="${@h.param('min')}">
                            <input type="number" name="max" min="0" step="1000" class="form-control form-control-sm" placeholder="Đến" th:value="${@h.param('max')}">
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="instock" value="1" id="instock" th:checked="${@h.paramBool('instock')}">
                        <label class="form-check-label small" for="instock">Chỉ hiện sản phẩm còn hàng</label>
                    </div>
                    <input type="hidden" name="sort" th:value="${sort}">
                    <button class="btn btn-primary btn-sm w-100">Áp dụng</button>
                    <a th:href="@{/products}" class="btn btn-link btn-sm w-100">Xóa bộ lọc</a>
                </div>
            </form>
        </aside>
        <section class="col-lg-9">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <div>
                    <h1 class="h4 fw-bold mb-0" th:text="${title}"></h1>
                    <div class="small text-muted" th:text="${page.total} + ' sản phẩm'"></div>
                </div>
                <form th:action="@{/products}" method="get" class="d-flex align-items-center gap-2">
                    <input th:each="kv : ${@h.paramsExcept('sort', 'page')}" type="hidden" th:name="${kv.key}" th:value="${kv.value}">
                    <label class="small text-muted text-nowrap" for="sort">Sắp xếp</label>
                    <select id="sort" name="sort" class="form-select form-select-sm" data-autosubmit>
                        <option th:each="o : ${ { {'bestseller','Bán chạy'}, {'newest','Mới nhất'}, {'price_asc','Giá tăng dần'}, {'price_desc','Giá giảm dần'}, {'rating','Đánh giá cao'}, {'name','Tên A-Z'} } }"
                                th:value="${o[0]}" th:selected="${sort == o[0]}" th:text="${o[1]}"></option>
                    </select>
                </form>
            </div>
            <div th:if="${!subCategories.isEmpty()}" class="d-flex flex-wrap gap-2 mb-3">
                <a th:each="sc : ${subCategories}" th:href="@{/products(category=${sc.slug})}" class="btn btn-sm btn-outline-primary rounded-pill">
                    <i th:class="'bi ' + ${sc.icon} + ' me-1'"></i><th:block th:text="${sc.name}"/></a>
            </div>
            <div th:if="${page.isEmpty()}" class="card card-body text-center text-muted py-5">
                <i class="bi bi-search fs-1"></i>
                <p class="mb-0 mt-2">Không tìm thấy sản phẩm phù hợp. Bạn có thể <a th:href="@{/consult}">hỏi dược sĩ</a> hoặc xem <a th:href="@{/faq}">câu hỏi thường gặp</a>.</p>
            </div>
            <div class="row row-cols-2 row-cols-md-3 g-3">
                <div class="col" th:each="p : ${page.items}"><th:block th:replace="~{partials/product-card :: card(${p})}"/></div>
            </div>
            <div class="mt-4"><th:block th:replace="~{partials/pagination :: links(${page})}"/></div>
        </section>
    </div>
</th:block>
</body>
</html>
