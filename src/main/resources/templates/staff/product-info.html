<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <form th:action="@{/staff/products/{id}/info(id=${product.id})}" method="post" class="card" style="max-width: 900px">
        <div class="card-header fw-semibold"><th:block th:text="${product.name}"/> <span class="badge text-bg-light border" th:text="${product.drugType.shortLabel}"></span></div>
        <div class="card-body row g-3">
            <div class="col-md-8"><label class="form-label" for="fIng">Hoạt chất</label>
                <input id="fIng" name="active_ingredient" class="form-control" maxlength="200" th:value="${product.activeIngredient}" placeholder="VD: Paracetamol, Caffeine"></div>
            <div class="col-md-4"><label class="form-label" for="fStr">Hàm lượng</label>
                <input id="fStr" name="strength" class="form-control" maxlength="100" th:value="${product.strength}" placeholder="VD: 500mg"></div>
            <div class="col-12"><label class="form-label" for="fdescription">Mô tả / công dụng</label>
                <textarea id="fdescription" name="description" class="form-control" rows="4" maxlength="2000" th:text="${product.description}"></textarea></div>
            <div class="col-12"><label class="form-label" for="fusage">Cách dùng, liều dùng</label>
                <textarea id="fusage" name="usage_instruction" class="form-control" rows="4" maxlength="2000" th:text="${product.usageInstruction}"></textarea></div>
            <div class="col-12"><label class="form-label" for="fcontra">Chống chỉ định</label>
                <textarea id="fcontra" name="contraindications" class="form-control" rows="4" maxlength="1000" th:text="${product.contraindications}"></textarea></div>
            <div class="col-12"><label class="form-label" for="fside">Tác dụng phụ</label>
                <textarea id="fside" name="side_effects" class="form-control" rows="4" maxlength="1000" th:text="${product.sideEffects}"></textarea></div>
        </div>
        <div class="card-footer bg-white"><button class="btn btn-primary">Lưu</button> <a th:href="@{/staff/products}" class="btn btn-link">Hủy</a>
            <span class="small text-muted ms-2">Giá, tồn kho, ảnh do quản trị viên cập nhật.</span></div>
    </form>
</th:block>
</body>
</html>
