<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="d-flex justify-content-end mb-3"><a th:href="@{/staff/posts/new}" class="btn btn-primary"><i class="bi bi-plus"></i> Viết bài mới</a></div>
            <div class="card">
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>Tiêu đề</th><th>Tác giả</th><th>Ngày đăng</th><th>Trạng thái</th><th></th></tr></thead>
                        <tbody>
                        <tr th:if="${posts.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">Chưa có bài viết.</td></tr>
                        <tr th:each="p : ${posts}">
                            <td><a th:href="@{/posts/{s}(s=${p.slug})}" target="_blank" th:text="${p.title}"></a></td>
                            <td class="small" th:text="${p.author != null ? p.author.fullName : ''}"></td>
                            <td class="small" th:text="${@fmt.date(p.createdAt)}"></td>
                            <td><span class="badge" th:classappend="${p.published} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${p.published} ? 'Đã đăng' : 'Nháp'"></span></td>
                            <td class="text-nowrap">
                                <a th:href="@{/staff/posts/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                                <form th:action="@{/staff/posts/{id}/delete(id=${p.id})}" method="post" class="d-inline" data-confirm="Xóa bài viết này?">
                                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
