<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-3 mb-4">
        <th:block th:if="${currentUser.can('RX_REVIEW')}"><th:block th:replace="~{staff/_parts :: stat('/staff/prescriptions', 'red', 'bi-file-earmark-medical', ${pendingRx}, 'Đơn thuốc chờ duyệt')}"/></th:block>
        <th:block th:if="${currentUser.can('ORDER')}">
            <th:block th:replace="~{staff/_parts :: stat('/staff/orders?status=PENDING', 'blue', 'bi-receipt', ${pendingOrders}, 'Đơn chờ xác nhận / soạn')}"/>
            <th:block th:replace="~{staff/_parts :: stat('/staff/orders?status=SHIPPING', 'green', 'bi-truck', ${inProgress}, 'Đang xử lý / giao')}"/>
            <th:block th:replace="~{staff/_parts :: stat('/staff/orders?returns=1', 'amber', 'bi-arrow-return-left', ${returns}, 'Yêu cầu đổi/trả')}"/>
        </th:block>
        <th:block th:if="${currentUser.can('CONSULT')}"><th:block th:replace="~{staff/_parts :: stat('/staff/consultations', 'violet', 'bi-chat-dots', ${openChats}, 'Cuộc tư vấn chờ dược sĩ')}"/></th:block>
        <th:block th:if="${currentUser.can('INVENTORY')}">
            <th:block th:replace="~{staff/_parts :: stat('/staff/inventory?filter=low', 'amber', 'bi-box-seam', ${lowStock}, 'Sản phẩm dưới định mức')}"/>
            <th:block th:replace="~{staff/_parts :: stat('/staff/inventory/alerts', 'amber', 'bi-hourglass-split', ${nearExpiry}, 'Lô cận hạn')}"/>
            <th:block th:replace="~{staff/_parts :: stat('/staff/inventory/alerts', 'red', 'bi-exclamation-octagon', ${expired}, 'Lô đã hết hạn còn tồn')}"/>
        </th:block>
    </div>
    <div class="row g-4">
        <div class="col-xl-6" th:if="${currentUser.can('RX_REVIEW')}">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between">Đơn thuốc chờ duyệt <a th:href="@{/staff/prescriptions}" class="small">Xem tất cả</a></div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="rx : ${rxQueue}">
                        <div><div class="fw-semibold" th:text="${rx.user.fullName}"></div>
                            <div class="small text-muted" th:text="(${rx.order != null} ? 'Đơn ' + ${rx.order.code} : 'Nhờ lên đơn') + ' · ' + ${@h.dt(rx.createdAt)}"></div></div>
                        <a th:href="@{/staff/prescriptions/{id}(id=${rx.id})}" class="btn btn-sm btn-primary">Duyệt</a>
                    </li>
                    <li th:if="${rxQueue.isEmpty()}" class="list-group-item text-muted">Không có đơn thuốc chờ duyệt.</li>
                </ul>
            </div>
        </div>
        <div class="col-xl-6" th:if="${currentUser.can('ORDER')}">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between">Đơn hàng cần xử lý <a th:href="@{/staff/orders}" class="small">Xem tất cả</a></div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="o : ${recentOrders}">
                        <div><a class="fw-semibold" th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a>
                            <span th:class="'badge text-bg-' + ${o.status.color}" th:text="${o.status.label}"></span>
                            <div class="small text-muted" th:text="${o.recipient} + ' · ' + ${@h.dt(o.createdAt)}"></div></div>
                        <span class="fw-semibold" th:text="${@h.money(o.total)}"></span>
                    </li>
                    <li th:if="${recentOrders.isEmpty()}" class="list-group-item text-muted">Không có đơn cần xử lý.</li>
                </ul>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
