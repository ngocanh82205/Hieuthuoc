<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <ul class="nav nav-pills mb-3">
        <li class="nav-item"><a th:class="'nav-link ' + (${status == null} ? 'active' : '')" th:href="@{/staff/adjustments}">Tất cả</a></li>
        <li class="nav-item" th:each="s : ${statuses}"><a th:class="'nav-link ' + (${status == s} ? 'active' : '')" th:href="@{/staff/adjustments(status=${s.name()})}"><th:block th:text="${s.label}"/>
            <span th:if="${s.name() == 'PENDING' and pendingCount > 0}" class="badge text-bg-danger" th:text="${pendingCount}"></span></a></li>
    </ul>
    <th:block th:replace="~{staff/_parts :: adjustmentTable(${list}, ${back})}"/>
</th:block>
</body>
</html>
