<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form th:action="${post.id == null} ? @{/staff/posts} : @{/staff/posts/{id}(id=${post.id})}" method="post" class="card">
                <div class="card-body">
                    <div class="mb-3"><label class="form-label">Tiêu đề</label><input name="title" class="form-control" th:value="${post.title}" required minlength="5" maxlength="200"></div>
                    <div class="mb-3"><label class="form-label">Tóm tắt</label><textarea name="summary" class="form-control" rows="2" maxlength="500" th:text="${post.summary}"></textarea></div>
                    <div class="mb-3"><label class="form-label">Nội dung</label>
                        <textarea name="content" class="form-control" rows="14" required minlength="20" th:text="${post.content}"></textarea>
                        <div class="form-text">Mỗi đoạn văn cách nhau bởi một dòng trống.</div></div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="published" value="true" id="published" th:checked="${post.id == null || post.published}">
                        <label class="form-check-label" for="published">Đăng công khai</label>
                    </div>
                    <button class="btn btn-primary">Lưu bài viết</button>
                    <a th:href="@{/staff/posts}" class="btn btn-link">Hủy</a>
                </div>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
