<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <ul class="nav nav-pills mb-3">
        <li class="nav-item"><a th:class="'nav-link ' + (${rating == 0} ? 'active' : '')" th:href="@{/staff/reviews}">Tất cả</a></li>
        <li class="nav-item" th:each="i : ${#numbers.sequence(5, 1, -1)}"><a th:class="'nav-link ' + (${rating == i} ? 'active' : '')" th:href="@{/staff/reviews(rating=${i})}" th:text="${i} + ' ★'"></a></li>
    </ul>
    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Sản phẩm</th><th>Khách</th><th>Đánh giá</th><th>Nhận xét</th><th>Ngày</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${reviews.items}" th:class="${r.hidden} ? 'text-muted' : ''">
                    <td><a th:href="@{/products/{s}(s=${r.product.slug})}" target="_blank" th:text="${r.product.name}"></a></td>
                    <td class="small"><th:block th:text="${r.user.fullName}"/><div th:if="${r.order != null}"><span class="badge text-bg-success-subtle text-success-emphasis" th:text="'Đã mua · ' + ${r.order.code}"></span></div></td>
                    <td class="text-warning text-nowrap"><th:block th:text="${@h.stars(r.rating)}"/></td>
                    <td class="small"><th:block th:text="${r.comment} ?: '-'"/> <span th:if="${r.hidden}" class="badge text-bg-secondary">Đã ẩn</span></td>
                    <td class="small text-muted" th:text="${@h.date(r.createdAt)}"></td>
                    <td><form th:action="@{/staff/reviews/{id}/toggle(id=${r.id})}" method="post">
                        <button th:class="'btn btn-sm ' + (${r.hidden} ? 'btn-outline-success' : 'btn-outline-secondary')" th:text="${r.hidden} ? 'Hiện' : 'Ẩn'"></button></form></td>
                </tr>
                <tr th:if="${reviews.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">Chưa có đánh giá.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><th:block th:replace="~{partials/pagination :: links(${reviews})}"/></div>
</th:block>
</body>
</html>
