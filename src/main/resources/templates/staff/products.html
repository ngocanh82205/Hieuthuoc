<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form class="card card-body mb-3 d-flex flex-row gap-2" method="get" th:action="@{/staff/products}">
                <input name="q" class="form-control" th:value="${q}" placeholder="Tìm tên thuốc hoặc hoạt chất">
                <button class="btn btn-primary">Tìm</button>
            </form>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Sản phẩm</th><th>Hoạt chất / hàm lượng</th><th>Loại</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${products}">
                            <td class="fw-semibold" th:text="${p.name}"></td>
                            <td class="small" th:text="(${p.activeIngredient} ?: '-') + ' ' + (${p.strength} ?: '')"></td>
                            <td><span class="badge" th:classappend="'text-bg-' + ${p.drugType.color}" th:text="${p.drugType.shortLabel}"></span></td>
                            <td class="text-end"><a th:if="${currentUser.can('CONTENT')}"
                                                    th:href="@{/staff/products/{id}/info(id=${p.id})}" class="btn btn-sm btn-outline-primary">Cập nhật thông tin</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
