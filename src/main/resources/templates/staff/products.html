<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <form class="d-flex gap-2 mb-3" method="get" th:action="@{/staff/products}" style="max-width: 480px">
        <input name="q" th:value="${q}" class="form-control" placeholder="Tên sản phẩm / hoạt chất" aria-label="Tìm sản phẩm">
        <button class="btn btn-primary"><i class="bi bi-search"></i></button>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Sản phẩm</th><th>Loại</th><th>Hoạt chất / hàm lượng</th><th>Danh mục</th><th>Thông tin</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${products.items}" th:class="${p.active} ? '' : 'text-muted'">
                    <td class="fw-semibold"><th:block th:text="${p.name}"/><span th:unless="${p.active}" class="badge text-bg-secondary ms-1">Ngừng bán</span></td>
                    <td><span th:class="'badge text-bg-' + (${p.drugType.isPrescription()} ? 'danger' : 'light border')" th:text="${p.drugType.shortLabel}"></span></td>
                    <td class="small" th:text="(${p.activeIngredient} ?: '-') + ' ' + (${p.strength} ?: '')"></td>
                    <td class="small" th:text="${p.category != null} ? ${p.category.name} : ''"></td>
                    <td class="small">
                        <span th:class="'badge ' + (${p.usageInstruction != null} ? 'text-bg-success' : 'text-bg-warning')">Cách dùng</span>
                        <span th:class="'badge ' + (${p.contraindications != null} ? 'text-bg-success' : 'text-bg-warning')">Chống chỉ định</span>
                        <span th:class="'badge ' + (${p.sideEffects != null} ? 'text-bg-success' : 'text-bg-warning')">Tác dụng phụ</span>
                    </td>
                    <td><a th:if="${currentUser.can('CONTENT')}" th:href="@{/staff/products/{id}/info(id=${p.id})}" class="btn btn-sm btn-outline-primary">Cập nhật</a></td>
                </tr>
                <tr th:if="${products.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">Không tìm thấy sản phẩm.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><th:block th:replace="~{partials/pagination :: links(${products})}"/></div>
</th:block>
</body>
</html>
