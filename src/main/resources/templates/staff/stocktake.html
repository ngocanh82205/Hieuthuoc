<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form th:action="@{/staff/stocktake}" method="post" class="card">
                <div class="card-header d-flex flex-wrap justify-content-between gap-2 align-items-center">
                    <span><i class="bi bi-clipboard-check text-primary me-1"></i>Phiếu kiểm kê - nhập số lượng đếm thực tế (bỏ trống = khớp sổ sách)</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary no-print" onclick="window.print()"><i class="bi bi-printer"></i> In phiếu đếm</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead><tr><th>Sản phẩm</th><th>Số lô</th><th>HSD</th><th class="text-end">Sổ sách</th><th style="width: 130px">Thực đếm</th><th>Trạng thái</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${batches}" th:classappend="${b.expired} ? 'table-danger'">
                            <td th:text="${b.product.name}"></td>
                            <td class="fw-semibold" th:text="${b.batchNo}"></td>
                            <td class="small" th:text="${@fmt.date(b.expDate)}"></td>
                            <td class="text-end" th:text="${b.quantity} + ' ' + ${b.product.unit}"></td>
                            <td><input type="number" min="0" class="form-control form-control-sm" th:name="'count_' + ${b.id}"></td>
                            <td class="small"><span th:if="${b.expired}" class="badge text-bg-danger">Hết hạn</span>
                                <span th:if="${b.locked}" class="badge text-bg-dark">Khóa</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
                    <input name="note" class="form-control form-control-sm" style="max-width: 360px" placeholder="Ghi chú đợt kiểm kê (VD: kiểm kê cuối tháng)">
                    <span class="small text-muted">Chênh lệch thiếu được ghi giảm; chênh lệch thừa cần quyền "Điều chỉnh tăng tồn kho".</span>
                    <button class="btn btn-primary" data-confirm="Áp dụng kết quả kiểm kê vào tồn kho?">Áp dụng kiểm kê</button>
                </div>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
