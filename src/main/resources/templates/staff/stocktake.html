<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <span class="small text-muted">Kết quả được lưu thành <strong>phiếu kiểm kê</strong> (biên bản) gồm mọi lô trong danh sách.</span>
        <a th:href="@{/staff/stocktake/history}" class="btn btn-sm btn-outline-secondary ms-auto"><i class="bi bi-clock-history"></i> Lịch sử kiểm kê</a>
    </div>
    <div th:if="${!recent.isEmpty()}" class="small mb-3">Gần đây:
        <a th:each="r : ${recent}" th:href="@{/staff/stocktake/{id}(id=${r.id})}" class="badge text-bg-light border text-decoration-none fw-normal"
           th:text="${r.code} + ' · ' + ${@h.date(r.createdAt)} + ' · ' + (${r.diffLines > 0} ? ${r.diffLines} + ' lô lệch' : 'khớp')"></a>
    </div>
    <form th:action="@{/staff/stocktake}" method="post">
        <div class="card">
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead><tr><th>Sản phẩm</th><th>Lô</th><th>HSD</th><th class="text-end">Sổ sách</th>
                        <th class="text-end" title="Đã xuất lô cho đơn đang soạn / đóng gói, hàng còn trong nhà thuốc">Chờ giao</th>
                        <th class="text-end">Phải có</th><th style="width: 140px">Thực đếm</th></tr></thead>
                    <tbody>
                    <tr th:each="b : ${batches}" th:with="pending=${pendingOut.getOrDefault(b.id, 0L)}">
                        <td><th:block th:text="${b.product.name}"/> <span class="small text-muted" th:text="'(' + ${b.product.unit} + ')'"></span></td><td th:text="${b.batchNo}"></td>
                        <td class="small" th:text="${@h.date(b.expDate)}"></td>
                        <td class="text-end" th:text="${@h.num(b.quantity)}"></td>
                        <td th:class="'text-end ' + (${pending > 0} ? 'text-warning fw-semibold' : 'text-muted')" th:text="${pending > 0} ? ${@h.num(pending)} : '-'"></td>
                        <td class="text-end fw-semibold" th:text="${@h.num(b.quantity + pending)}"></td>
                        <td><input type="number" min="0" th:name="'count[' + ${b.id} + ']'" th:value="${old['count[' + b.id + ']']}" class="form-control form-control-sm"
                                   th:placeholder="${b.quantity + pending}" th:aria-label="'Thực đếm lô ' + ${b.batchNo}"></td></tr>
                    <tr th:if="${batches.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">Không có lô hàng.</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap gap-2 align-items-center">
                <input name="note" th:value="${old['note']}" class="form-control" style="max-width: 360px" maxlength="150" placeholder="Ghi chú đợt kiểm kê" aria-label="Ghi chú">
                <span class="small text-muted">Đếm cả hàng đã soạn chờ giao. Chỉ nhập ô có chênh lệch; ô trống = khớp cột "Phải có".</span>
                <button class="btn btn-primary ms-auto" data-confirm="Lưu phiếu kiểm kê? Lô chênh lệch sẽ được lập phiếu điều chỉnh.">Lưu kết quả kiểm kê</button>
            </div>
        </div>
    </form>
</th:block>
</body>
</html>
