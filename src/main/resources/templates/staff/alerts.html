<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-4">
        <th:block th:replace="~{staff/_parts :: alertSection('Đã hết hạn - cần hủy', ${expired}, 'danger', 'bi-x-octagon')}"/>
        <th:block th:replace="~{staff/_parts :: alertSection('Cận hạn (trong ' + ${nearDays} + ' ngày)', ${nearExpiry}, 'warning', 'bi-hourglass-split')}"/>
        <th:block th:replace="~{staff/_parts :: alertSection('Lô đang khóa (thu hồi / nghi ngờ chất lượng)', ${locked}, 'dark', 'bi-lock')}"/>
        <div class="col-xl-6">
            <div class="card h-100 border-primary">
                <div class="card-header fw-semibold text-primary"><i class="bi bi-graph-down-arrow"></i> <th:block th:text="'Dưới định mức tồn (' + ${lowStock.size()} + ')'"/></div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Sản phẩm</th><th class="text-end">Có thể bán</th><th class="text-end">Định mức</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${lowStock}"><td th:text="${p.name}"></td><td class="text-end text-danger fw-semibold" th:text="${@h.num(p.available)}"></td>
                            <td class="text-end" th:text="${@h.num(p.minStock)}"></td>
                            <td><a th:href="@{/staff/receipts/new}" class="btn btn-sm btn-light">Nhập thêm</a></td></tr>
                        <tr th:if="${lowStock.isEmpty()}"><td colspan="4" class="text-center text-muted py-3">Không có.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
