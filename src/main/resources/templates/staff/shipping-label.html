<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-white">
<main class="container py-4 print-page" th:with="o=${order}">
    <div class="border border-2 border-dark rounded p-4">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <div class="fw-bold fs-5" th:text="${settings['store_name']}"></div>
                <div class="small" th:text="${settings['store_address']}"></div>
                <div class="small" th:text="'Hotline: ' + ${settings['store_phone']}"></div>
            </div>
            <div class="text-end">
                <div class="fw-bold fs-4">PHIẾU GIAO HÀNG</div>
                <div class="fs-5 fw-bold font-monospace" th:text="${o.code}"></div>
                <div class="small" th:if="${o.carrier != null}" th:text="${o.carrier} + (${o.trackingCode != null} ? ' · ' + ${o.trackingCode} : '')"></div>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-7">
                <div class="small text-muted">NGƯỜI NHẬN</div>
                <div class="fs-5 fw-bold" th:text="${o.recipient}"></div>
                <div class="fs-5" th:text="${o.phone}"></div>
                <div th:text="${o.address != null ? o.address : 'Nhận tại nhà thuốc'}"></div>
                <div class="small mt-2" th:if="${o.note != null}"><strong>Ghi chú:</strong> <span th:text="${o.note}"></span></div>
            </div>
            <div class="col-5 text-end">
                <div class="small text-muted">THU HỘ (COD)</div>
                <div class="fs-3 fw-bold" th:text="${o.paymentStatus.name() == 'PAID'} ? '0 ₫' : ${@fmt.money(o.total)}"></div>
                <div class="small" th:text="${o.paymentStatus.name() == 'PAID'} ? 'Khách đã thanh toán' : ${o.paymentMethod.label}"></div>
            </div>
        </div>
        <hr>
        <div class="small text-muted mb-1">NỘI DUNG HÀNG (<span th:text="${o.items.size()}"></span> sản phẩm)</div>
        <div th:each="it : ${o.items}" class="small" th:text="'• ' + ${it.productName} + ' x' + ${it.quantity} + ' ' + ${it.unit}"></div>
        <div class="small mt-3 text-muted">Hàng thuốc - vui lòng giữ nơi khô ráo, tránh ánh nắng trực tiếp. Không cho xem hàng thuốc kê đơn trước khi thanh toán.</div>
    </div>
    <div class="text-center mt-4 no-print"><button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> In</button></div>
</main>
</body>
</html>
