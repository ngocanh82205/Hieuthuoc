<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/print :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<div class="border border-2 border-dark rounded p-4" th:with="o=${order}, paid=${order.paymentStatus.name() == 'PAID'}">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div><div class="fw-bold fs-5" th:text="${settings['store_name']}"></div><div class="small" th:text="${settings['store_address']}"></div>
            <div class="small" th:text="'Hotline: ' + ${settings['store_phone']}"></div></div>
        <div class="text-end"><div class="fw-bold fs-4">PHIẾU GIAO HÀNG</div><div class="fs-5 fw-bold font-monospace" th:text="${o.code}"></div>
            <div th:if="${o.carrier != null}" class="small" th:text="${o.carrier} + (${o.trackingCode != null} ? ' · ' + ${o.trackingCode} : '')"></div></div>
    </div>
    <hr>
    <div class="row">
        <div class="col-7">
            <div class="small text-muted">NGƯỜI NHẬN</div>
            <div class="fs-5 fw-bold" th:text="${o.recipient}"></div><div class="fs-5" th:text="${o.phone}"></div>
            <div th:text="${o.address != null} ? ${o.address} + (${o.province != null} ? ', ' + ${o.province} : '') : 'Nhận tại nhà thuốc'"></div>
            <div th:if="${o.note != null}" class="small mt-2"><strong>Ghi chú:</strong> <th:block th:text="${o.note}"/></div>
        </div>
        <div class="col-5 text-end">
            <div class="small text-muted">THU HỘ (COD)</div>
            <div class="fs-3 fw-bold" th:text="${paid} ? '0 ₫' : ${@h.money(o.total)}"></div>
            <div class="small" th:text="${paid} ? 'Khách đã thanh toán' : ${o.paymentMethod.label}"></div>
        </div>
    </div>
    <hr>
    <div class="small text-muted mb-1" th:text="'NỘI DUNG HÀNG (' + ${o.items.size()} + ' sản phẩm)'"></div>
    <div th:each="it : ${o.items}" class="small" th:text="'• ' + ${it.productName} + ' x' + ${it.quantity} + ' ' + ${it.unit}"></div>
    <div class="small mt-3 text-muted">Hàng thuốc - vui lòng giữ nơi khô ráo, tránh ánh nắng trực tiếp. Không cho xem hàng thuốc kê đơn trước khi thanh toán.</div>
</div>
</th:block>
</body>
</html>
