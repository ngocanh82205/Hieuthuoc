<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <th:block th:replace="~{staff/_parts :: rxTabs(${status}, ${statuses})}"/>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead><tr><th>#</th><th>Khách hàng</th><th>Đơn hàng</th><th>Gửi lúc</th><th>Dược sĩ</th><th>Ghi chú</th><th></th></tr></thead>
                <tbody>
                <tr th:each="rx : ${list}">
                    <td th:text="${rx.id}"></td>
                    <td><div class="fw-semibold" th:text="${rx.user.fullName}"></div><small class="text-muted" th:text="${rx.user.phone}"></small></td>
                    <td><th:block th:if="${rx.order != null}"><a th:href="@{/staff/orders/{id}(id=${rx.order.id})}" th:text="${rx.order.code}"></a><div class="small" th:text="${@h.money(rx.order.total)}"></div></th:block>
                        <span th:if="${rx.order == null}" class="badge text-bg-info">Nhờ lên đơn</span></td>
                    <td class="small" th:text="${@h.dt(rx.createdAt)}"></td>
                    <td class="small" th:text="${rx.pharmacist != null} ? ${rx.pharmacist.fullName} : '-'"></td>
                    <td class="small" th:text="${rx.status.name() == 'REJECTED'} ? ${rx.rejectReason} : ${rx.customerNote}"></td>
                    <td><a th:href="@{/staff/prescriptions/{id}(id=${rx.id})}" th:class="'btn btn-sm ' + (${rx.status.name() == 'PENDING'} ? 'btn-primary' : 'btn-outline-secondary')"
                           th:text="${rx.status.name() == 'PENDING'} ? 'Duyệt' : 'Xem'"></a></td>
                </tr>
                <tr th:if="${list.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">Không có đơn thuốc.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
