<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-4">
        <div class="col-xl-8">
            <div class="card">
                <div class="card-header"><th:block th:text="${batch.product.name} + ' - lô ' + ${batch.batchNo} + ' (HSD ' + ${@h.date(batch.expDate)} + ') · '"/>
                    <th:block th:replace="~{staff/_parts :: batchStatus(${batch}, ${nearDays})}"/></div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Đơn hàng</th><th>Khách hàng</th><th>Liên hệ</th><th class="text-end">SL từ lô</th><th>Ngày</th></tr></thead>
                        <tbody>
                        <tr th:each="a : ${buyers}" th:with="o=${a.orderItem.order}">
                            <td><a th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a> <th:block th:replace="~{partials/misc :: status(${o.status})}"/></td>
                            <td th:text="${o.user.fullName}"></td>
                            <td class="small" th:text="${o.phone} + (${o.user.email != null and !o.user.locked} ? ' · ' + ${o.user.email} : '')"></td>
                            <td class="text-end" th:text="${@h.num(a.quantity)}"></td><td class="small" th:text="${@h.date(o.createdAt)}"></td></tr>
                        <tr th:if="${buyers.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">Chưa có khách nào mua từ lô này.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-xl-4">
            <form th:action="@{/staff/batches/{id}/notify-buyers(id=${batch.id})}" method="post" class="card border-danger">
                <div class="card-header text-danger fw-semibold"><i class="bi bi-megaphone"></i> Thông báo thu hồi tới khách đã mua</div>
                <div class="card-body">
                    <textarea name="message" class="form-control mb-2" rows="4" required minlength="10" maxlength="400" aria-label="Nội dung thông báo"
                              placeholder="VD: Theo công văn số .../QLD-CL, lô thuốc này bị thu hồi do không đạt chỉ tiêu chất lượng. Vui lòng ngừng sử dụng..."></textarea>
                    <button class="btn btn-danger w-100" th:data-confirm="'Gửi thông báo thu hồi tới ' + ${buyers.size()} + ' lượt mua?'">Gửi thông báo (web + email)</button>
                    <div th:unless="${batch.locked}" class="small text-muted mt-2">Nên khóa lô trước để ngừng xuất bán.</div>
                </div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
