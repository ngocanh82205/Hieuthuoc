<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
        <ul class="nav nav-pills">
            <li class="nav-item" th:each="e : ${views}"><a th:class="'nav-link ' + (${view == e.key} ? 'active' : '')"
                th:href="${closed} ? @{/staff/consultations(view=${e.key}, closed=1)} : @{/staff/consultations(view=${e.key})}"><i th:if="${e.key == 'ai'}" class="bi bi-robot"></i> <th:block th:text="${e.value}"/></a></li>
        </ul>
        <ul class="nav nav-pills">
            <li class="nav-item"><a th:class="'nav-link ' + (${closed} ? '' : 'active')" th:href="@{/staff/consultations(view=${view})}">Đang mở</a></li>
            <li class="nav-item"><a th:class="'nav-link ' + (${closed} ? 'active' : '')" th:href="@{/staff/consultations(view=${view}, closed=1)}">Đã đóng</a></li>
        </ul>
    </div>
    <div class="alert alert-info small py-2"><i class="bi bi-broadcast me-1"></i>Dược sĩ đang online:
        <th:block th:each="u, s : ${online}"><span class="text-success">●</span> <th:block th:text="${u.fullName} + (${s.last} ? '' : ',')"/> </th:block>
        <th:block th:if="${online.isEmpty()}">không có</th:block>
        · Hội thoại mới do trợ lý AI tiếp nhận trước (<th:block th:text="${aiEngine}"/>), chuyển cho dược sĩ online ít việc nhất khi cần tư vấn thuốc.</div>
    <div class="card">
        <div class="list-group list-group-flush">
            <a th:each="c : ${list}" th:with="m=${last.get(c.id)}" class="list-group-item list-group-item-action d-flex justify-content-between gap-3" th:href="@{/staff/consultations/{id}(id=${c.id})}">
                <div class="text-truncate">
                    <div class="fw-semibold"><th:block th:text="${c.customer.fullName}"/>
                        <span th:if="${c.isAiMode()}" class="badge text-bg-light border"><i class="bi bi-robot"></i> AI đang hỗ trợ</span>
                        <span th:if="${!c.isAiMode() and m != null and m.sender != null and !m.sender.isStaff()}" class="badge text-bg-danger">Chờ trả lời</span>
                        <span th:if="${!c.isAiMode() and c.handoffReason != null and c.handedOffAt != null}" class="badge text-bg-info" th:title="${c.handoffReason}">Từ AI</span>
                    </div>
                    <div class="small text-muted text-truncate" th:text="${m == null} ? '' : (${m.body} ?: '[Ảnh]')"></div>
                </div>
                <div class="text-end small text-muted text-nowrap">
                    <div th:text="${@h.dt(c.updatedAt)}"></div>
                    <div th:text="${c.pharmacist != null} ? ${c.pharmacist.fullName} : (${c.isAiMode()} ? 'Trợ lý AI' : 'Chưa nhận')"></div>
                </div>
            </a>
            <div th:if="${list.isEmpty()}" class="list-group-item text-muted">Không có cuộc tư vấn.</div>
        </div>
    </div>
</th:block>
</body>
</html>
