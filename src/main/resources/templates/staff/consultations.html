<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
                <ul class="nav nav-pills">
                    <li class="nav-item"><a class="nav-link" th:classappend="${view == 'mine'} ? 'active'" th:href="@{/staff/consultations(view='mine',closed=${closed})}">Của tôi</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${view == 'unassigned'} ? 'active'" th:href="@{/staff/consultations(view='unassigned',closed=${closed})}">Chưa ai nhận</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${view == 'all'} ? 'active'" th:href="@{/staff/consultations(view='all',closed=${closed})}">Tất cả</a></li>
                </ul>
                <ul class="nav nav-pills">
                    <li class="nav-item"><a class="nav-link" th:classappend="${!closed} ? 'active'" th:href="@{/staff/consultations(view=${view})}">Đang mở</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${closed} ? 'active'" th:href="@{/staff/consultations(view=${view},closed=true)}">Đã đóng</a></li>
                </ul>
            </div>
            <div class="alert alert-info small py-2"><i class="bi bi-broadcast me-1"></i>Dược sĩ đang online:
                <span th:if="${online.isEmpty()}">không có</span>
                <span th:each="u, st : ${online}"><span class="text-success">●</span> <span th:text="${u.fullName}"></span><span th:unless="${st.last}">, </span></span>
                · Hội thoại mới được tự động giao cho dược sĩ online ít việc nhất.</div>
            <div class="card">
                <ul class="list-group list-group-flush">
                    <li th:if="${list.isEmpty()}" class="list-group-item text-muted">Không có cuộc tư vấn.</li>
                    <a class="list-group-item list-group-item-action d-flex justify-content-between gap-3" th:each="c : ${list}"
                       th:href="@{/staff/consultations/{id}(id=${c.id})}" th:with="m=${last[c.id]}">
                        <div class="text-truncate">
                            <div class="fw-semibold"><span th:text="${c.customer.fullName}"></span>
                                <span th:if="${m != null && !m.sender.staff}" class="badge text-bg-danger">Chờ trả lời</span></div>
                            <div class="small text-muted text-truncate" th:text="${m != null ? (m.body != null ? m.body : '[Ảnh]') : ''}"></div>
                        </div>
                        <div class="text-end small text-muted text-nowrap">
                            <div th:text="${@fmt.dateTime(c.updatedAt)}"></div>
                            <div th:text="${c.pharmacist != null ? c.pharmacist.fullName : 'Chưa nhận'}"></div>
                        </div>
                    </a>
                </ul>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
