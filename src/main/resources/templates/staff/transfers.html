<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="small text-muted mb-0">Chuyển hàng giữa các kho / chi nhánh. Lô hàng giữ nguyên số lô, hạn dùng để truy vết. Chỉ hàng ở kho "được bán" mới bán online và tại quầy.</p>
                <a th:href="@{/staff/transfers/new}" class="btn btn-primary"><i class="bi bi-plus"></i> Tạo phiếu chuyển kho</a>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Mã phiếu</th><th>Từ kho</th><th>Đến kho</th><th>Chi tiết</th><th class="text-end">Tổng SL</th><th>Người lập</th></tr></thead>
                        <tbody>
                        <tr th:if="${slips.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">Chưa có phiếu chuyển kho.</td></tr>
                        <tr th:each="t : ${slips}">
                            <td class="fw-semibold" th:text="${t.code}"></td>
                            <td th:text="${t.fromWarehouse.name}"></td>
                            <td th:text="${t.toWarehouse.name}"></td>
                            <td class="small"><div th:each="i : ${t.items}" th:text="${i.sourceBatch.product.name} + ' - lô ' + ${i.sourceBatch.batchNo} + ' x' + ${i.quantity}"></div>
                                <div th:if="${t.note != null}" class="text-muted fst-italic" th:text="${t.note}"></div></td>
                            <td class="text-end" th:text="${t.totalQuantity}"></td>
                            <td class="small"><div th:text="${t.createdBy != null ? t.createdBy.fullName : ''}"></div><div class="text-muted" th:text="${@fmt.dateTime(t.createdAt)}"></div></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
