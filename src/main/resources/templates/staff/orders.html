<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form class="card card-body mb-3" method="get" th:action="@{/staff/orders}">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4"><label class="form-label small">Tìm kiếm</label>
                        <input name="q" class="form-control form-control-sm" th:value="${q}" placeholder="Mã đơn, tên, SĐT, email"></div>
                    <div class="col-md-3"><label class="form-label small">Trạng thái</label>
                        <select name="status" class="form-select form-select-sm">
                            <option value="">Tất cả</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${status == s}"
                                    th:text="${s.label} + ' (' + ${counts[s.name()] ?: 0} + ')'"></option>
                        </select></div>
                    <div class="col-md-3"><label class="form-label small">Thanh toán</label>
                        <select name="payment" class="form-select form-select-sm">
                            <option value="">Tất cả</option>
                            <option value="COD" th:selected="${payment != null && payment.name() == 'COD'}">COD</option>
                            <option value="ONLINE" th:selected="${payment != null && payment.name() == 'ONLINE'}">Online</option>
                        </select></div>
                    <div class="col-md-2"><button class="btn btn-primary btn-sm w-100">Lọc</button></div>
                </div>
                <div class="mt-2 small">
                    <a th:href="@{/staff/orders(returns=true)}" class="badge text-bg-warning text-decoration-none" th:if="${returnCount > 0}"
                       th:text="${returnCount} + ' yêu cầu đổi/trả cần xử lý'"></a>
                </div>
            </form>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th class="text-end">Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th></tr></thead>
                        <tbody>
                        <tr th:if="${page.empty}"><td colspan="6" class="text-center text-muted py-4">Không có đơn hàng.</td></tr>
                        <tr th:each="o : ${page.content}">
                            <td><a class="fw-semibold" th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a>
                                <i th:if="${o.needsPrescription}" class="bi bi-file-earmark-medical text-danger" title="Có thuốc kê đơn"></i></td>
                            <td><div th:text="${o.recipient}"></div><small class="text-muted" th:text="${o.phone}"></small></td>
                            <td class="small text-nowrap" th:text="${@fmt.dateTime(o.createdAt)}"></td>
                            <td class="text-end fw-semibold text-nowrap" th:text="${@fmt.money(o.total)}"></td>
                            <td><small th:text="${o.paymentMethod.name()}"></small>
                                <span class="badge" th:classappend="'text-bg-' + ${o.paymentStatus.color}" th:text="${o.paymentStatus.label}"></span></td>
                            <td><span th:replace="~{fragments/staff :: orderStatus(${o.status})}"></span>
                                <span th:if="${o.returnStatus != null}" class="badge" th:classappend="'text-bg-' + ${o.returnStatus.color}" th:text="${o.returnStatus.label}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav th:replace="~{fragments/layout :: pagination(${page})}"></nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
