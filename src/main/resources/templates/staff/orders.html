<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <form class="card card-body mb-3" method="get" th:action="@{/staff/orders}">
        <div class="row g-2 align-items-end">
            <div class="col-md-4"><label class="form-label small">Tìm kiếm</label><input name="q" class="form-control form-control-sm" th:value="${q}" placeholder="Mã đơn, tên, SĐT, mã vận đơn"></div>
            <div class="col-md-3"><label class="form-label small">Trạng thái</label>
                <select name="status" class="form-select form-select-sm"><option value="">Tất cả</option>
                    <option th:each="s : ${statuses}" th:value="${s.name()}" th:selected="${status == s}" th:text="${s.label} + ' (' + (${counts[s.name()]} ?: 0) + ')'"></option>
                </select></div>
            <div class="col-md-3"><label class="form-label small">Thanh toán</label>
                <select name="payment" class="form-select form-select-sm"><option value="">Tất cả</option>
                    <option th:each="pm : ${payments}" th:value="${pm.name()}" th:selected="${payment == pm}" th:text="${pm.label}"></option>
                </select></div>
            <div class="col-md-2"><button class="btn btn-primary btn-sm w-100">Lọc</button></div>
            <div class="col-md-3"><label class="form-label small">Từ ngày</label><input type="date" name="from" class="form-control form-control-sm" th:value="${@h.param('from')}"></div>
            <div class="col-md-3"><label class="form-label small">Đến ngày</label><input type="date" name="to" class="form-control form-control-sm" th:value="${@h.param('to')}"></div>
            <div class="col-md-3"><label class="form-label small">Kênh bán</label>
                <select name="channel" class="form-select form-select-sm"><option value="">Tất cả</option>
                    <option value="ONLINE" th:selected="${@h.param('channel') == 'ONLINE'}">Online</option>
                    <option value="POS" th:selected="${@h.param('channel') == 'POS'}">Tại quầy (POS)</option></select></div>
        </div>
        <div class="mt-2 small d-flex flex-wrap gap-2">
            <a th:each="s : ${quick}" th:href="@{/staff/orders(status=${s.name()})}" th:class="'badge text-decoration-none ' + (${status == s} ? 'text-bg-primary' : 'text-bg-light border')"
               th:text="${s.label} + ': ' + (${counts[s.name()]} ?: 0)"></a>
            <a th:if="${returnCount > 0}" th:href="@{/staff/orders(returns=1)}" class="badge text-bg-warning text-decoration-none" th:text="${returnCount} + ' yêu cầu đổi/trả cần xử lý'"></a>
        </div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th class="text-end">Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Người xử lý</th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders.items}">
                    <td><a class="fw-semibold" th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a>
                        <i th:if="${o.needsPrescription}" class="bi bi-file-earmark-medical text-danger" title="Có thuốc kê đơn"></i>
                        <span th:if="${o.isPos()}" class="badge text-bg-info">Quầy</span></td>
                    <td><div th:text="${o.recipient}"></div><small class="text-muted" th:text="${o.phone}"></small></td>
                    <td class="small text-nowrap" th:text="${@h.dt(o.createdAt)}"></td>
                    <td class="text-end fw-semibold text-nowrap" th:text="${@h.money(o.total)}"></td>
                    <td><small th:text="${o.paymentMethod.shortLabel}"></small> <span th:class="'badge text-bg-' + ${o.paymentStatus.color}" th:text="${o.paymentStatus.label}"></span></td>
                    <td><th:block th:replace="~{partials/misc :: status(${o.status})}"/>
                        <span th:if="${o.returnStatus != null}" th:class="'badge text-bg-' + ${o.returnStatus.color}" th:text="${o.returnStatus.label}"></span></td>
                    <td class="small" th:text="${o.handler != null} ? ${o.handler.fullName} : ''"></td>
                </tr>
                <tr th:if="${orders.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">Không có đơn hàng.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><th:block th:replace="~{partials/pagination :: links(${orders})}"/></div>
</th:block>
</body>
</html>
