<!--/* Ô thống kê trên trang tổng quan */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="stat(href, color, icon, value, label)" class="col-6 col-xl-3">
    <a th:href="${href}" class="stat-card"><div th:class="'icon icon-' + ${color}"><i th:class="'bi ' + ${icon}"></i></div>
        <div><div class="value" th:text="${value}"></div><div class="label" th:text="${label}"></div></div></a></div>

<!--/* Tab trang Duyệt đơn thuốc theo trạng thái + Sổ thuốc kê đơn. status = null khi đang ở sổ */-->
<ul xmlns:th="http://www.thymeleaf.org" th:fragment="rxTabs(status, statuses)" class="nav nav-pills mb-3 no-print">
    <li class="nav-item" th:each="s : ${statuses}"><a th:class="'nav-link ' + (${status == s} ? 'active' : '')" th:href="@{/staff/prescriptions(status=${s.name()})}"
        th:text="${s.label}"></a></li>
    <li class="nav-item"><a th:class="'nav-link ' + (${status == null} ? 'active' : '')" th:href="@{/staff/prescriptions/log}">Sổ thuốc kê đơn</a></li>
</ul>

<!--/* Trạng thái lô: khóa / hết hạn / cận hạn / còn hạn */-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="batchStatus(b, nearDays)">
    <span th:if="${b.locked}" class="badge text-bg-dark" th:title="${b.lockReason}"><i class="bi bi-lock"></i> Khóa</span>
    <span th:if="${!b.locked and b.isExpired()}" class="badge text-bg-danger">Hết hạn</span>
    <span th:if="${!b.locked and !b.isExpired() and b.daysLeft() <= nearDays}" class="badge text-bg-warning" th:text="'Cận hạn ' + ${b.daysLeft()} + ' ngày'"></span>
    <span th:if="${!b.locked and !b.isExpired() and b.daysLeft() > nearDays}" class="badge text-bg-success">Còn hạn</span>
</th:block>

<!--/* Bảng lô cho trang cảnh báo kho */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="alertSection(label, list, color, icon)" class="col-xl-6">
    <div th:class="'card h-100 border-' + ${color}">
        <div th:class="'card-header fw-semibold text-' + (${color == 'dark'} ? 'body' : ${color})"><i th:class="'bi ' + ${icon}"></i> <th:block th:text="${label} + ' (' + ${list.size()} + ')'"/></div>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th>Sản phẩm</th><th>Lô</th><th>Hạn dùng</th><th class="text-end">SL</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${list}"><td th:text="${b.product.name}"></td>
                    <td th:text="${b.batchNo}"></td><td class="small" th:text="${@h.date(b.expDate)}"></td><td class="text-end" th:text="${@h.num(b.quantity)}"></td>
                    <td><a th:href="@{/staff/inventory/{id}(id=${b.productId})}" class="btn btn-sm btn-light">Xử lý</a></td></tr>
                <tr th:if="${list.isEmpty()}"><td colspan="5" class="text-center text-muted py-3">Không có.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!--/* Bảng phiếu hủy / điều chỉnh kho (dùng ở staff và admin): back = URL quay lại sau khi duyệt */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="adjustmentTable(list, back)" class="card">
    <div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>#</th><th>Sản phẩm / lô</th><th>Loại</th><th class="text-end">SL</th><th>Lý do</th><th>Người lập</th><th>Trạng thái</th><th style="min-width: 240px"></th></tr></thead>
            <tbody>
            <tr th:each="a : ${list}">
                <td class="small"><th:block th:text="${a.id}"/><div class="text-muted" th:text="${@h.dt(a.createdAt)}"></div></td>
                <td><th:block th:text="${a.batch.product.name}"/><div class="small text-muted" th:text="'Lô ' + ${a.batch.batchNo} + ' · tồn ' + ${@h.num(a.batch.quantity)}"></div></td>
                <td class="small" th:text="${a.typeLabel()}"></td>
                <td th:class="'text-end fw-semibold ' + (${a.quantity < 0} ? 'text-danger' : 'text-success')" th:text="(${a.quantity > 0} ? '+' : '') + ${a.quantity}"></td>
                <td class="small"><th:block th:text="${a.reason}"/><div th:if="${a.rejectReason != null}" class="text-danger" th:text="'Từ chối: ' + ${a.rejectReason}"></div></td>
                <td class="small"><th:block th:text="${a.user != null} ? ${a.user.fullName} : ''"/><div th:if="${a.approver != null}" class="text-muted" th:text="'Duyệt: ' + ${a.approver.fullName}"></div></td>
                <td><span th:class="'badge text-bg-' + ${a.status.color}" th:text="${a.status.label}"></span></td>
                <td>
                    <form th:if="${a.status.name() == 'PENDING' and currentUser.can('APPROVE_STOCK')}" th:action="@{/staff/adjustments/{id}/decide(id=${a.id})}" method="post" class="d-flex gap-1">
                        <input type="hidden" name="back" th:value="${back}">
                        <input name="reason" class="form-control form-control-sm" placeholder="Lý do (nếu từ chối)" aria-label="Lý do từ chối">
                        <button name="decision" value="approve" class="btn btn-sm btn-success">Duyệt</button>
                        <button name="decision" value="reject" class="btn btn-sm btn-outline-danger">Từ chối</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${list.isEmpty()}"><td colspan="8" class="text-center text-muted py-4">Không có phiếu.</td></tr>
            </tbody>
        </table>
    </div>
</div>
