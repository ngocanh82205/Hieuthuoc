<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Thông tin tài khoản</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Họ tên</span><span class="fw-semibold" th:text="${me.fullName}"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Chức vụ</span><span th:text="${me.positionLabel()}"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Email</span><span th:text="${me.email} ?: '-'"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Điện thoại</span><span th:text="${me.phone} ?: '-'"></span></li>
                    <li th:if="${me.licenseNo != null}" class="list-group-item d-flex justify-content-between"><span class="text-muted">Số CCHN</span><span th:text="${me.licenseNo}"></span></li>
                    <li class="list-group-item">
                        <div class="text-muted small mb-1">Quyền được cấp</div>
                        <span th:each="p : ${me.permissionSet()}" class="badge text-bg-light border me-1" th:text="${p.label}"></span>
                    </li>
                </ul>
                <div class="card-footer bg-white small text-muted">Thông tin cá nhân do quản trị viên cập nhật.</div>
            </div>
        </div>
        <div class="col-lg-6">
            <form th:action="@{/staff/profile/password}" method="post" class="card">
                <div class="card-header fw-semibold">Đổi mật khẩu</div>
                <div class="card-body">
                    <div class="mb-3"><label class="form-label">Mật khẩu hiện tại</label><input type="password" name="current" class="form-control" required autocomplete="current-password"></div>
                    <div class="mb-3"><label class="form-label">Mật khẩu mới</label><input type="password" name="password" class="form-control" required minlength="6" autocomplete="new-password"></div>
                    <div class="mb-3"><label class="form-label">Nhập lại mật khẩu mới</label><input type="password" name="password_confirmation" class="form-control" required autocomplete="new-password"></div>
                    <button class="btn btn-primary"><i class="bi bi-key"></i> Đổi mật khẩu</button>
                </div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
