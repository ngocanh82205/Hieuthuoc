<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <form class="d-flex flex-wrap gap-2 mb-3" method="get" th:action="@{/staff/inventory}">
        <input name="q" th:value="${q}" class="form-control" style="max-width: 320px" placeholder="Tên sản phẩm / hoạt chất / số lô" aria-label="Tìm">
        <select name="filter" class="form-select" style="max-width: 200px" aria-label="Lọc" onchange="this.form.submit()">
            <option value="">Tất cả</option><option value="low" th:selected="${filter == 'low'}">Dưới định mức</option><option value="out" th:selected="${filter == 'out'}">Hết hàng</option>
        </select>
        <button class="btn btn-primary"><i class="bi bi-search"></i></button>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/staff/receipts/new}" class="btn btn-outline-primary"><i class="bi bi-truck"></i> Nhập kho</a>
            <a th:href="@{/staff/stocktake}" class="btn btn-outline-secondary"><i class="bi bi-clipboard-check"></i> Kiểm kê</a>
        </div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Sản phẩm</th><th class="text-end">Tồn thực</th><th class="text-end">Giữ cho đơn</th><th class="text-end">Có thể bán</th><th class="text-end">Định mức</th><th>Hạn gần nhất</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${products}" th:class="${p.active} ? '' : 'text-muted'">
                    <td><div class="fw-semibold" th:text="${p.name}"></div><div class="small text-muted" th:text="${p.drugType.shortLabel} + ' · ' + ${p.unit} + (${p.active} ? '' : ' · ngừng bán')"></div>
                        <div th:if="${lots.containsKey(p.id)}" class="d-flex flex-wrap gap-1 mt-1">
                            <a th:each="b : ${lots.get(p.id)}" th:with="u=@{/staff/inventory/{id}(id=${p.id})} + '#batch-' + ${b.id}" th:href="${u}" class="badge text-bg-warning text-decoration-none fw-normal">
                                <i class="bi bi-upc"></i> <th:block th:text="'Lô ' + ${b.batchNo} + ' · HSD ' + ${@h.date(b.expDate)} + ' · tồn ' + ${@h.num(b.quantity)} + (${b.locked} ? ' · đã khóa' : '')"/></a>
                        </div></td>
                    <td class="text-end" th:text="${@h.num(p.onHand)}"></td>
                    <td class="text-end" th:text="${@h.num(p.onHand - p.available)}"></td>
                    <td th:class="'text-end fw-semibold ' + (${p.isLowStock()} ? 'text-danger' : '')"><th:block th:text="${@h.num(p.available)}"/>
                        <i th:if="${p.isLowStock()}" class="bi bi-exclamation-triangle-fill" title="Dưới định mức"></i></td>
                    <td class="text-end" th:text="${@h.num(p.minStock)}"></td>
                    <td class="small" th:text="${nextExp.containsKey(p.id)} ? ${@h.date(nextExp.get(p.id))} : '-'"></td>
                    <td><a th:href="@{/staff/inventory/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Lô hàng</a></td>
                </tr>
                <tr th:if="${products.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">Không có sản phẩm.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small text-muted mt-2">"Có thể bán" = tồn trong kho bán, còn hạn, không khóa, trừ phần đang giữ cho đơn chưa xuất kho.</p>
</th:block>
</body>
</html>
