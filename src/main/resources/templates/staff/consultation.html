<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-4" th:with="mine=${conv.pharmacist != null and conv.pharmacist.id == currentUser.id}">
        <div class="col-xl-8">
            <div class="card" id="chat" th:data-me="${currentUser.id}" th:data-last-id="${lastId}" th:data-fetch-url="@{/staff/consultations/{id}/messages(id=${conv.id})}">
                <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <span><th:block th:text="${customer.fullName}"/>
                        <span class="small text-muted" th:text="'· phụ trách: ' + (${conv.pharmacist != null} ? ${conv.pharmacist.fullName} : (${conv.isAiMode()} ? 'Trợ lý AI' : 'chưa có'))"></span>
                        <span th:if="${conv.isAiMode()}" class="badge text-bg-light border"><i class="bi bi-robot"></i> AI đang hỗ trợ</span></span>
                    <div class="d-flex flex-wrap gap-1">
                        <span th:if="${busyOwner != null and !currentUser.isAdmin()}" class="small text-muted align-self-center"><i class="bi bi-person-lock"></i> <th:block th:text="${busyOwner.fullName} + ' đang tư vấn'"/></span>
                        <form th:if="${(busyOwner == null or currentUser.isAdmin()) and !mine}" th:action="@{/staff/consultations/{id}/claim(id=${conv.id})}" method="post">
                            <button class="btn btn-sm btn-primary" th:text="${conv.isAiMode()} ? 'Tiếp nhận từ AI' : (${conv.pharmacist != null} ? 'Tiếp quản' : 'Nhận')"></button></form>
                        <form th:if="${!staffList.isEmpty()}" th:action="@{/staff/consultations/{id}/transfer(id=${conv.id})}" method="post" class="d-flex gap-1">
                            <select name="to_user_id" class="form-select form-select-sm" style="max-width: 170px" aria-label="Chuyển cho">
                                <option th:each="st : ${staffList}" th:value="${st.id}" th:text="${st.fullName} + (${st.isOnline()} ? ' 🟢' : '')"></option>
                            </select>
                            <button class="btn btn-sm btn-outline-secondary">Chuyển</button></form>
                        <form th:action="@{/staff/consultations/{id}/close(id=${conv.id})}" method="post">
                            <button class="btn btn-sm btn-outline-secondary" th:text="${conv.closed} ? 'Mở lại' : 'Đóng'"></button></form>
                    </div>
                </div>
                <div th:if="${conv.handoffReason != null}" class="alert alert-info rounded-0 border-0 border-bottom small mb-0">
                    <div class="fw-semibold"><i class="bi bi-robot"></i> <th:block th:text="'Chuyển lúc ' + ${@h.dt(conv.handedOffAt)} + ': ' + ${conv.handoffReason}"/></div>
                    <div th:if="${conv.aiSummary != null}" style="white-space: pre-line" th:text="'Tóm tắt: ' + ${conv.aiSummary}"></div>
                </div>
                <div class="card-body">
                    <div class="chat-box mb-3" aria-live="polite">
                        <div th:if="${messages.isEmpty()}" class="chat-empty text-center text-muted py-5">Chưa có tin nhắn.</div>
                        <th:block th:each="m : ${messages}"><th:block th:replace="~{partials/chat-message :: message(${m}, ${currentUser.id}, false)}"/></th:block>
                    </div>
                    <form th:action="@{/staff/consultations/{id}/messages(id=${conv.id})}" method="post" enctype="multipart/form-data">
                        <textarea name="body" class="form-control mb-2" rows="3" maxlength="2000" placeholder="Nhập câu trả lời..." aria-label="Câu trả lời"></textarea>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <select class="form-select form-select-sm" style="max-width: 320px" data-insert aria-label="Gợi ý sản phẩm">
                                <option value="">+ Gợi ý sản phẩm...</option>
                                <option th:each="p : ${products}" th:value="${p.name} + ' - ' + ${@h.money(p.price)} + '/' + ${p.unit} + ': ' + ${@h.abs('/products/' + p.slug)}" th:text="${p.name}"></option>
                            </select>
                            <input type="file" name="image" class="form-control form-control-sm" style="max-width: 260px" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Ảnh">
                            <button type="submit" class="btn btn-primary ms-auto"><i class="bi bi-send"></i> Gửi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-xl-4">
            <th:block th:replace="~{partials/misc :: warnings(${warnings})}"/>
            <div class="health-box p-3 mb-3 small">
                <div class="fw-semibold mb-2"><i class="bi bi-heart-pulse text-danger"></i> Hồ sơ sức khỏe</div>
                <div th:text="${customer.phone} + (${customer.email != null} ? ' · ' + ${customer.email} : '')"></div>
                <div th:if="${customer.gender != null or customer.birthday != null}" th:text="(${customer.gender} ?: '') + ' ' + (${customer.birthday != null} ? 'sinh ' + ${@h.date(customer.birthday)} : '')"></div>
                <div><strong>Dị ứng:</strong> <th:block th:text="${customer.allergies != null and !customer.allergies.isBlank()} ? ${customer.allergies} : 'Không ghi nhận'"/></div>
                <div><strong>Bệnh nền:</strong> <th:block th:text="${customer.chronicConditions != null and !customer.chronicConditions.isBlank()} ? ${customer.chronicConditions} : 'Không ghi nhận'"/></div>
                <div th:if="${customer.pregnancy}" class="text-danger fw-semibold">Đang mang thai / cho con bú</div>
            </div>
            <form class="card mb-3" th:action="@{/staff/consultations/{id}/suggest(id=${conv.id})}" method="post">
                <div class="card-header"><i class="bi bi-cart-plus text-primary me-1"></i>Gửi giỏ hàng tư vấn</div>
                <div class="card-body">
                    <div class="row g-1 mb-1" th:each="i : ${#numbers.sequence(1, 4)}">
                        <div class="col-9"><select name="items[]" class="form-select form-select-sm" aria-label="Sản phẩm">
                            <option value="">-- Sản phẩm --</option>
                            <th:block th:each="p : ${products}"><option th:each="u : ${p.unitOptions()}" th:value="${p.id} + ':' + ${u.id()}"
                                th:text="${p.name} + ' (' + ${u.name()} + ') - ' + ${@h.money(u.price())}"></option></th:block>
                        </select></div>
                        <div class="col-3"><input type="number" min="1" name="qtys[]" class="form-control form-control-sm" placeholder="SL" aria-label="Số lượng"></div>
                    </div>
                    <input name="note" class="form-control form-control-sm mt-2" maxlength="500" placeholder="Lời dặn (VD: uống sau ăn, ngày 2 lần)" aria-label="Lời dặn">
                    <button class="btn btn-primary btn-sm mt-2 w-100"><i class="bi bi-send"></i> Gửi cho khách</button>
                </div>
            </form>
            <div class="card mb-3" th:if="${!recent.isEmpty()}">
                <div class="card-header">Thuốc đã mua 90 ngày qua</div>
                <div class="card-body small" th:text="${recentNames}"></div>
            </div>
            <div class="card">
                <div class="card-header">Đơn hàng gần đây</div>
                <ul class="list-group list-group-flush small">
                    <li class="list-group-item" th:each="o : ${orders}">
                        <a th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a> <th:block th:replace="~{partials/misc :: status(${o.status})}"/>
                        <div class="text-muted" th:text="${@h.date(o.createdAt)} + ' · ' + ${@h.money(o.total)}"></div>
                        <div th:text="${#strings.listJoin(o.items.![productName], ', ')}"></div>
                    </li>
                    <li th:if="${orders.isEmpty()}" class="list-group-item text-muted">Chưa có đơn hàng.</li>
                </ul>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
