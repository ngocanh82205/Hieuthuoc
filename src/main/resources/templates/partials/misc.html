<!--/* Các partial nhỏ: trạng thái đơn, tiến trình đơn, cảnh báo an toàn, chia sẻ, danh sách thông báo */-->
<span xmlns:th="http://www.thymeleaf.org" th:fragment="status(s)" th:class="'badge text-bg-' + ${s.color}" th:text="${s.label}"></span>

<!--/* Thanh tiến trình đơn hàng */-->
<th:block th:fragment="steps(order)"
          th:with="codes=${ {'PENDING','CONFIRMED','PREPARING','PACKED','SHIPPING','COMPLETED'} },
                   labels=${ {'Đã đặt','Đã xác nhận','Đang xử lý','Đã đóng gói','Đang vận chuyển','Đã giao'} },
                   icons=${ {'bi-receipt','bi-check2','bi-box-seam','bi-box2-heart','bi-truck','bi-house-check'} },
                   st=${order.status.name()},
                   idx=${codes.indexOf(st) >= 0 ? codes.indexOf(st) : ((st == 'PENDING_RX' or st == 'AWAITING_CUSTOMER') ? 0 : -1)}">
    <div th:if="${st != 'CANCELLED' and st != 'RETURNED' and st != 'RX_REJECTED'}" class="order-steps">
        <div th:each="code, it : ${codes}" th:class="'step ' + ((${it.index < idx or st == 'COMPLETED'}) ? 'done' : (${it.index == idx} ? 'current' : ''))">
            <div class="dot"><i th:class="'bi ' + ${icons[it.index]}"></i></div>
            <div th:text="${labels[it.index]}"></div>
        </div>
    </div>
</th:block>

<!--/* Cảnh báo an toàn thuốc: list = List<SafetyService.Warning> */-->
<th:block th:fragment="warnings(list)">
    <div th:if="${list != null and !list.isEmpty()}" class="card border-danger mb-3">
        <div class="card-header text-danger"><i class="bi bi-shield-exclamation me-1"></i>Cảnh báo an toàn thuốc (<th:block th:text="${list.size()}"/>)</div>
        <ul class="list-group list-group-flush small">
            <li th:each="w : ${list}" th:class="'list-group-item list-group-item-' + (${w.level() == 'danger'} ? 'danger' : (${w.level() == 'warning'} ? 'warning' : 'info'))">
                <i th:class="'bi ' + ${w.icon()} + ' me-1'"></i><th:block th:text="${w.message()}"/></li>
        </ul>
    </div>
    <div th:if="${list == null or list.isEmpty()}" class="alert alert-success small py-2"><i class="bi bi-shield-check me-1"></i>Không phát hiện cảnh báo dị ứng / tương tác với dữ liệu hiện có.</div>
</th:block>

<!--/* Chia sẻ mạng xã hội */-->
<div th:fragment="share(url, text, productId)" class="share-bar d-inline-flex align-items-center gap-1 ms-md-auto" th:attr="data-share-product=${productId}"
     th:with="eu=${#uris.escapeQueryParam(url)}, et=${#uris.escapeQueryParam(text)}">
    <span class="small text-muted me-1">Chia sẻ:</span>
    <a class="btn btn-light js-share" data-network="facebook" target="_blank" rel="noopener" title="Chia sẻ Facebook"
       th:href="${'https://www.facebook.com/sharer/sharer.php?u=' + eu}"><i class="bi bi-facebook text-primary"></i></a>
    <a class="btn btn-light js-share" data-network="zalo" target="_blank" rel="noopener" title="Chia sẻ Zalo"
       th:href="${'https://sp.zalo.me/share_to_zalo?url=' + eu}"><i class="bi bi-chat-dots-fill text-info"></i></a>
    <a class="btn btn-light js-share" data-network="x" target="_blank" rel="noopener" title="Chia sẻ X"
       th:href="${'https://twitter.com/intent/tweet?url=' + eu + '&text=' + et}"><i class="bi bi-twitter-x"></i></a>
    <button type="button" class="btn btn-light js-share js-copy-link" data-network="copy" th:attr="data-url=${url}" title="Sao chép liên kết"><i class="bi bi-link-45deg"></i></button>
</div>

<!--/* Danh sách thông báo: notifications = Page<UserNotification> */-->
<th:block th:fragment="notifications(notifications)">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Thông báo</span>
            <form th:action="@{/notifications/read-all}" method="post"><button class="btn btn-sm btn-link">Đánh dấu tất cả đã đọc</button></form>
        </div>
        <ul class="list-group list-group-flush">
            <li th:each="n : ${notifications.items}" th:class="'list-group-item ' + (${n.seen} ? '' : 'bg-light')">
                <a th:if="${n.link != null}" th:href="@{/notifications/{id}/go(id=${n.id})}" th:text="${n.message}"></a>
                <th:block th:if="${n.link == null}" th:text="${n.message}"/>
                <div class="small text-muted" th:text="${@h.dt(n.createdAt)}"></div>
            </li>
            <li th:if="${notifications.isEmpty()}" class="list-group-item text-muted">Chưa có thông báo.</li>
        </ul>
    </div>
    <div class="mt-3"><th:block th:replace="~{partials/pagination :: links(${notifications})}"/></div>
</th:block>
