<header xmlns:th="http://www.thymeleaf.org" th:fragment="navbar" class="site-header">
    <div class="topbar d-none d-md-block">
        <div class="container d-flex justify-content-between align-items-center">
            <span><i class="bi bi-patch-check-fill me-1"></i>Nhà thuốc đạt chuẩn GPP · 100% thuốc chính hãng · Dược sĩ tư vấn miễn phí</span>
            <span class="d-flex gap-3">
                <span><i class="bi bi-truck me-1"></i>Freeship đơn từ <strong th:text="${@h.money(settings['free_ship_threshold'])}"></strong></span>
                <span><i class="bi bi-telephone-fill me-1"></i>Hotline: <strong th:text="${settings['store_phone']}"></strong></span>
            </span>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"><th:block th:replace="~{partials/logo :: logo}"/></a>
            <div class="d-flex align-items-center gap-2 order-lg-3">
                <a th:if="${currentUser == null or currentUser.customer}" th:href="@{/cart}" class="btn btn-light icon-btn position-relative" aria-label="Giỏ hàng">
                    <i class="bi bi-bag-heart"></i>
                    <span th:class="'badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle js-cart-count' + (${cartCount == 0} ? ' d-none' : '')"
                          th:text="${cartCount}"></span>
                </a>
                <th:block th:if="${currentUser != null}">
                    <a th:href="@{/notifications}" class="btn btn-light icon-btn position-relative" aria-label="Thông báo">
                        <i class="bi bi-bell"></i>
                        <span th:if="${unreadCount > 0}" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle" th:text="${unreadCount}"></span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <img th:if="${currentUser.avatar != null}" th:src="${currentUser.avatar}" alt="" class="rounded-circle" width="22" height="22" referrerpolicy="no-referrer">
                            <i th:unless="${currentUser.avatar != null}" class="bi bi-person-circle"></i>
                            <span class="d-none d-sm-inline" th:text="${currentUser.fullName}"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <th:block th:if="${currentUser.customer}">
                                <li><a class="dropdown-item" th:href="@{/account}"><i class="bi bi-person me-2"></i>Tài khoản</a></li>
                                <li><a class="dropdown-item" th:href="@{/account/orders}"><i class="bi bi-receipt me-2"></i>Đơn hàng của tôi</a></li>
                                <li><a class="dropdown-item" th:href="@{/account/prescriptions}"><i class="bi bi-file-earmark-medical me-2"></i>Gửi đơn thuốc</a></li>
                                <li><a class="dropdown-item" th:href="@{/account/wishlist}"><i class="bi bi-heart me-2"></i>Yêu thích</a></li>
                                <li><a class="dropdown-item js-open-consult-widget" th:href="@{/consult}"><i class="bi bi-chat-dots me-2"></i>Tư vấn dược sĩ</a></li>
                            </th:block>
                            <li th:unless="${currentUser.customer}"><a class="dropdown-item" th:href="@{/staff}"><i class="bi bi-speedometer2 me-2"></i>Trang quản lý</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>
                <th:block th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-outline-primary d-none d-sm-inline-block">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn btn-primary d-none d-sm-inline-block">Đăng ký</a>
                    <a th:href="@{/login}" class="btn btn-light d-sm-none" aria-label="Đăng nhập"><i class="bi bi-person"></i></a>
                </th:block>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse order-lg-2" id="mainNav">
                <form class="d-flex my-2 my-lg-0 mx-lg-3 flex-grow-1 search-form" th:action="@{/products}" method="get" role="search">
                    <input class="form-control" type="search" name="q" th:value="${@h.param('q')}" placeholder="Tìm tên thuốc, hoạt chất, triệu chứng..." list="searchSuggest" autocomplete="off">
                    <button class="btn btn-primary ms-1" aria-label="Tìm kiếm"><i class="bi bi-search"></i></button>
                </form>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Danh mục</a>
                        <ul class="dropdown-menu">
                            <li th:each="c : ${navCategories}" th:if="${c.depth < 3}">
                                <a th:class="'dropdown-item ' + (${c.depth == 0} ? 'fw-semibold' : 'small')" th:href="@{/products(category=${c.slug})}"
                                   th:style="${c.depth > 0} ? 'padding-left: ' + ${1 + c.depth * 1.1} + 'rem' : null">
                                    <i th:class="'bi ' + ${c.icon} + ' me-2'"></i><th:block th:text="${c.name}"/></a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/products}">Tất cả sản phẩm</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/posts}">Góc sức khỏe</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/faq}">Hỏi đáp</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
