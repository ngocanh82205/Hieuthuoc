<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: page(~{::content}, ~{}, false, 'container py-5 auth-wrap')}">
<body>
<th:block th:fragment="content">
<div class="card auth-card w-100 mx-auto" style="max-width: 980px">
    <div class="row g-0">
        <th:block th:replace="~{auth/_parts :: side('Chào mừng trở lại!')}"/>
        <div class="col-lg-7">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-1 text-gradient">Đăng nhập</h1>
                <p class="text-muted mb-4">Dành cho khách hàng, dược sĩ và quản trị viên.</p>
                <th:block th:replace="~{partials/flash :: flash}"/>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Email hoặc số điện thoại</label>
                        <input class="form-control" type="text" id="username" name="username" th:value="${old['username']}" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between"><label class="form-label" for="password">Mật khẩu</label>
                            <a th:href="@{/forgot-password}" class="small">Quên mật khẩu?</a></div>
                        <div class="input-group">
                            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
                            <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember" value="1">
                        <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                    </div>
                    <button class="btn btn-primary btn-lg w-100">Đăng nhập</button>
                </form>
                <th:block th:replace="~{auth/_parts :: google}"/>
                <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
                <th:block th:if="${@h.setting('show_demo_accounts', '1') == '1'}">
                    <hr>
                    <div class="small text-muted">
                        <div class="fw-semibold mb-1">Tài khoản demo:</div>
                        <div>Admin: <code>admin@hieuthuoc.vn</code> / <code>admin123</code></div>
                        <div>Dược sĩ: <code>duocsi@hieuthuoc.vn</code> / <code>duocsi123</code></div>
                        <div>Khách hàng: <code>khachhang@gmail.com</code> / <code>123456</code></div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
