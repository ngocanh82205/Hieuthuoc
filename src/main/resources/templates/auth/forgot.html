<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: page(~{::content}, ~{}, false, 'container py-5 auth-wrap')}">
<body>
<th:block th:fragment="content">
<div class="card auth-card w-100 mx-auto" style="max-width: 980px">
    <div class="row g-0">
        <th:block th:replace="~{auth/_parts :: side('Lấy lại quyền truy cập tài khoản')}"/>
        <div class="col-lg-7">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-1 text-gradient">Quên mật khẩu</h1>
                <p class="text-muted mb-4">Nhập email hoặc số điện thoại đã đăng ký. Nhà thuốc sẽ gọi điện xác minh và cấp mật khẩu tạm cho bạn.</p>
                <th:block th:replace="~{partials/flash :: flash}"/>
                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="identifier">Email hoặc SĐT đã đăng ký</label>
                        <input class="form-control" id="identifier" name="identifier" th:value="${old['identifier']}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="contact_phone">Số điện thoại liên hệ</label>
                        <input class="form-control" id="contact_phone" name="contact_phone" th:value="${old['contact_phone']}" required pattern="0[0-9]{9,10}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="note">Ghi chú (VD: thời gian có thể nghe máy)</label>
                        <input class="form-control" id="note" name="note" th:value="${old['note']}" maxlength="300">
                    </div>
                    <button class="btn btn-primary btn-lg w-100">Gửi yêu cầu</button>
                </form>
                <p class="text-center mt-3 mb-0"><a th:href="@{/login}"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
