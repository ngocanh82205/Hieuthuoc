<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-5 auth-wrap">
    <div class="card auth-card w-100 mx-auto" style="max-width: 980px">
        <div class="row g-0">
            <div class="col-lg-5 auth-side d-none d-lg-flex flex-column justify-content-between p-5">
                <div class="bubbles"><span></span><span></span><span></span><span></span><span></span></div>
                <div th:insert="~{fragments/layout :: logo}"></div>
                <div>
                    <h2 class="fw-bold mb-3">Gia nhập cộng đồng VinaPharma</h2>
                    <ul class="list-unstyled d-grid gap-3 mb-0">
                        <li><i class="bi bi-check-circle-fill me-2"></i>Theo dõi đơn hàng mọi lúc</li>
                        <li><i class="bi bi-check-circle-fill me-2"></i>Lưu hồ sơ sức khỏe, tư vấn an toàn hơn</li>
                        <li><i class="bi bi-check-circle-fill me-2"></i>Tích điểm và nhận ưu đãi thành viên</li>
                    </ul>
                </div>
                <small class="opacity-75">Nhà thuốc trực tuyến đạt chuẩn GPP</small>
            </div>
            <div class="col-lg-7">
        <div>
            <div>
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 fw-bold mb-1 text-gradient">Tạo tài khoản</h1>
                    <p class="text-muted mb-4">Theo dõi đơn hàng, lưu hồ sơ sức khỏe và được dược sĩ tư vấn.</p>
                    <div th:if="${errors}" class="alert alert-danger">
                        <ul class="mb-0 ps-3"><li th:each="e : ${errors}" th:text="${e}"></li></ul>
                    </div>
                    <form th:action="@{/register}" th:object="${form}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="fullName">Họ và tên</label>
                            <input class="form-control" id="fullName" th:field="*{fullName}" required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="email">Email <span class="text-muted small">(không bắt buộc)</span></label>
                                <input class="form-control" type="email" id="email" th:field="*{email}">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="phone">Số điện thoại</label>
                                <input class="form-control" id="phone" th:field="*{phone}" required pattern="0[0-9]{9,10}">
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label" for="password">Mật khẩu</label>
                                <div class="input-group">
                                    <input class="form-control" type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
                                    <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Hiện mật khẩu">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="passwordConfirm">Nhập lại mật khẩu</label>
                                <div class="input-group">
                                    <input class="form-control" type="password" id="passwordConfirm" name="passwordConfirm" required minlength="6" autocomplete="new-password">
                                    <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Hiện mật khẩu">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-lg w-100">Đăng ký</button>
                    </form>
                    <p class="text-center mt-3 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
                </div>
            </div>
        </div>
    </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
