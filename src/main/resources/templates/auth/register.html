<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app :: page(~{::content}, ~{}, false, 'container py-5 auth-wrap')}">
<body>
<th:block th:fragment="content">
<div class="card auth-card w-100 mx-auto" style="max-width: 980px">
    <div class="row g-0">
        <th:block th:replace="~{auth/_parts :: side('Gia nhập cộng đồng VinaPharma')}"/>
        <div class="col-lg-7">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 fw-bold mb-1 text-gradient">Tạo tài khoản</h1>
                <p class="text-muted mb-4">Theo dõi đơn hàng, lưu hồ sơ sức khỏe và được dược sĩ tư vấn.</p>
                <th:block th:replace="~{partials/flash :: flash}"/>
                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="full_name">Họ và tên</label>
                        <input class="form-control" id="full_name" name="full_name" th:value="${old['full_name']}" required maxlength="100">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label" for="phone">Số điện thoại</label>
                            <input class="form-control" id="phone" name="phone" th:value="${old['phone']}" required pattern="0[0-9]{9,10}">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="email">Email <span class="text-muted small">(không bắt buộc)</span></label>
                            <input class="form-control" type="email" id="email" name="email" th:value="${old['email']}">
                        </div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <div class="input-group">
                                <input class="form-control" type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
                                <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="password_confirmation">Nhập lại mật khẩu</label>
                            <div class="input-group">
                                <input class="form-control" type="password" id="password_confirmation" name="password_confirmation" required minlength="6" autocomplete="new-password">
                                <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100">Đăng ký</button>
                </form>
                <th:block th:replace="~{auth/_parts :: google}"/>
                <p class="text-center mt-3 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
