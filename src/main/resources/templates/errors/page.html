<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:with="s=${status != null ? status : 500}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Lỗi ' + ${s}">Lỗi</title>
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="card mx-auto text-center" style="max-width: 520px">
        <div class="card-body p-5">
            <div class="display-4 text-primary mb-2">
                <i th:class="'bi ' + (${s == 404} ? 'bi-search' : (${s == 403} ? 'bi-shield-lock' : (${s == 419} ? 'bi-clock-history' : 'bi-exclamation-circle')))"></i>
            </div>
            <h1 class="h4" th:text="${s == 404} ? 'Không tìm thấy trang' : (${s == 403} ? 'Không có quyền truy cập' : (${s == 419} ? 'Phiên làm việc đã hết hạn'
                : (${s == 429} ? 'Thao tác quá nhanh' : (${s < 500} ? 'Không thực hiện được' : 'Đã có lỗi xảy ra'))))"></h1>
            <p class="text-muted" th:text="${message != null and !message.isEmpty() and s < 500} ? ${message}
                : (${s == 419} ? 'Vui lòng tải lại trang và thử lại.' : 'Vui lòng thử lại hoặc quay về trang chủ.')"></p>
            <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Về trang chủ</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại</a>
        </div>
    </div>
</main>
</body>
</html>
