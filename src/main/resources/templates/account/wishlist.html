<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/account :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <h1 class="h5 fw-bold mb-3"><i class="bi bi-heart-fill text-danger me-1"></i>Sản phẩm yêu thích</h1>
    <div th:if="${products.isEmpty()}" class="card card-body text-center text-muted py-5"><i class="bi bi-heart fs-1"></i><p class="mt-2 mb-0">Chưa có sản phẩm yêu thích. Nhấn biểu tượng trái tim trên sản phẩm để lưu lại.</p></div>
    <div class="row row-cols-2 row-cols-md-3 g-3 mb-4">
        <div class="col" th:each="p : ${products}"><th:block th:replace="~{partials/product-card :: card(${p})}"/></div>
    </div>
</th:block>
</body>
</html>
