<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-4">
    <div class="row g-4">
        <aside class="col-lg-3"><div th:replace="~{fragments/layout :: accountMenu}"></div></aside>
        <section class="col-lg-9">
            <div class="card">
                <div class="card-header">Thông báo</div>
                <ul class="list-group list-group-flush">
                    <li th:if="${notifications.isEmpty()}" class="list-group-item text-muted">Chưa có thông báo.</li>
                    <li class="list-group-item" th:each="n : ${notifications}" th:classappend="${!n.seen} ? 'bg-light'">
                        <a th:if="${n.link != null}" th:href="@{${n.link}}" th:text="${n.message}"></a>
                        <span th:unless="${n.link != null}" th:text="${n.message}"></span>
                        <div class="small text-muted" th:text="${@fmt.dateTime(n.createdAt)}"></div>
                    </li>
                </ul>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
