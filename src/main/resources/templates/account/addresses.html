<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-4">
    <div class="row g-4">
        <aside class="col-lg-3"><div th:replace="~{fragments/layout :: accountMenu}"></div></aside>
        <section class="col-lg-9">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="card mb-4">
                <div class="card-header">Sổ địa chỉ</div>
                <ul class="list-group list-group-flush">
                    <li th:if="${addresses.isEmpty()}" class="list-group-item text-muted">Chưa có địa chỉ nào.</li>
                    <li class="list-group-item d-flex flex-wrap justify-content-between gap-2" th:each="a : ${addresses}">
                        <div>
                            <strong th:text="${a.recipient}"></strong> · <span th:text="${a.phone}"></span>
                            <span th:if="${a.defaultAddress}" class="badge text-bg-primary ms-1">Mặc định</span>
                            <div class="text-muted small" th:text="${a.addressLine}"></div>
                        </div>
                        <div class="d-flex gap-1">
                            <form th:unless="${a.defaultAddress}" th:action="@{/account/addresses/{id}/default(id=${a.id})}" method="post">
                                <button class="btn btn-sm btn-outline-secondary">Đặt mặc định</button></form>
                            <form th:action="@{/account/addresses/{id}/delete(id=${a.id})}" method="post" data-confirm="Xóa địa chỉ này?">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="card">
                <div class="card-header">Thêm địa chỉ mới</div>
                <div class="card-body">
                    <form th:action="@{/account/addresses}" method="post" class="row g-3">
                        <div class="col-md-6"><label class="form-label">Người nhận</label><input class="form-control" name="recipient" required></div>
                        <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="phone" required pattern="0[0-9]{9,10}"></div>
                        <div class="col-12"><label class="form-label">Địa chỉ chi tiết</label><input class="form-control" name="addressLine" required minlength="10"></div>
                        <div class="col-12"><div class="form-check">
                            <input class="form-check-input" type="checkbox" name="makeDefault" value="true" id="makeDefault">
                            <label class="form-check-label" for="makeDefault">Đặt làm địa chỉ mặc định</label></div></div>
                        <div class="col-12"><button class="btn btn-primary">Thêm địa chỉ</button></div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
