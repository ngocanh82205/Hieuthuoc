<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/account :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-3 mb-4">
        <div class="col-sm-4"><div class="stat-card"><div class="icon icon-green"><i class="bi bi-receipt"></i></div>
            <div><div class="value" th:text="${orderCount}"></div><div class="label">Đơn hàng</div></div></div></div>
        <div class="col-sm-4"><div class="stat-card"><div class="icon icon-blue"><i class="bi bi-wallet2"></i></div>
            <div><div class="value fs-6" th:text="${@h.money(tier.spent())}"></div><div class="label">Tổng chi tiêu</div></div></div></div>
        <div class="col-sm-4"><div class="stat-card"><div class="icon icon-amber"><i class="bi bi-star"></i></div>
            <div><div class="value" th:text="${@h.num(profile.points)}"></div><div class="label">Điểm tích lũy</div></div></div></div>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="tier-card h-100">
                <div class="d-flex justify-content-between align-items-start position-relative" style="z-index:1">
                    <div>
                        <div class="small opacity-75">Hạng thành viên</div>
                        <div class="tier-name"><i class="bi bi-gem me-1"></i><th:block th:text="${tier.tier().label}"/></div>
                        <div class="small opacity-75" th:text="'Tích điểm x' + ${tier.tier().multiplier} + ' mỗi đơn hàng'"></div>
                    </div>
                    <div class="text-end">
                        <div class="small opacity-75">Điểm hiện có</div>
                        <div class="fs-3 fw-bold" th:text="${@h.num(profile.points)}"></div>
                        <div class="small opacity-75" th:text="'≈ ' + ${@h.money(profile.points * pointValue)}"></div>
                    </div>
                </div>
                <div class="mt-3 position-relative" style="z-index:1">
                    <div class="progress mb-1"><div class="progress-bar" th:style="'width: ' + ${tier.progress()} + '%'"></div></div>
                    <div class="small" th:text="${tier.next() != null} ? 'Chi tiêu thêm ' + ${@h.money(tier.toNext())} + ' để lên hạng ' + ${tier.next().label}
                        : 'Bạn đang ở hạng cao nhất. Cảm ơn bạn đã đồng hành!'"></div>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-3 small position-relative" style="z-index:1">
                    <span th:each="t : ${tiers}"><span class="tier-dot" th:style="'background: ' + ${t.color}"></span><th:block th:text="${t.label} + ' từ ' + ${@h.money(t.minSpent)}"/></span>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Thông tin cá nhân</div>
        <div class="card-body">
            <form th:action="@{/account/profile}" method="post" class="row g-3">
                <div class="col-md-6"><label class="form-label">Họ và tên</label><input class="form-control" name="full_name" th:value="${old['full_name'] ?: profile.fullName}" required></div>
                <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" th:value="${old['email'] ?: profile.email}"
                    th:readonly="${profile.googleId != null}" th:title="${profile.googleId != null} ? 'Tài khoản liên kết Google' : null"></div>
                <div class="col-md-4"><label class="form-label">Số điện thoại</label><input class="form-control" name="phone" th:value="${old['phone'] ?: profile.phone}" required pattern="0[0-9]{9,10}"></div>
                <div class="col-md-4"><label class="form-label">Giới tính</label>
                    <select class="form-select" name="gender"><option value="">--</option>
                        <option th:each="g : ${ {'Nam', 'Nữ', 'Khác'} }" th:value="${g}" th:selected="${profile.gender == g}" th:text="${g}"></option></select></div>
                <div class="col-md-4"><label class="form-label">Ngày sinh</label><input class="form-control" type="date" name="birthday" th:value="${@h.iso(profile.birthday)}"></div>
                <div class="col-12"><button class="btn btn-primary">Lưu thông tin</button></div>
            </form>
        </div>
    </div>

    <div class="card mb-4" id="health">
        <div class="card-header"><i class="bi bi-heart-pulse text-danger"></i> Hồ sơ sức khỏe</div>
        <div class="card-body">
            <p class="small text-muted">Thông tin này chỉ được dược sĩ xem khi tư vấn và duyệt đơn thuốc, giúp cảnh báo dị ứng và tương tác thuốc.</p>
            <form th:action="@{/account/health}" method="post" class="row g-3">
                <div class="col-md-6"><label class="form-label">Dị ứng thuốc / thực phẩm</label>
                    <textarea class="form-control" name="allergies" rows="2" maxlength="500" placeholder="VD: dị ứng penicillin" th:text="${profile.allergies}"></textarea></div>
                <div class="col-md-6"><label class="form-label">Bệnh nền / đang điều trị</label>
                    <textarea class="form-control" name="chronic_conditions" rows="2" maxlength="500" placeholder="VD: tăng huyết áp, tiểu đường" th:text="${profile.chronicConditions}"></textarea></div>
                <div class="col-12"><div class="form-check">
                    <input class="form-check-input" type="checkbox" name="pregnancy" value="1" id="pregnancy" th:checked="${profile.pregnancy}">
                    <label class="form-check-label" for="pregnancy">Đang mang thai hoặc cho con bú</label></div></div>
                <div class="col-12"><button class="btn btn-primary">Lưu hồ sơ sức khỏe</button></div>
            </form>
        </div>
    </div>

    <div class="card" id="password">
        <div class="card-header">Đổi mật khẩu</div>
        <div class="card-body">
            <form th:action="@{/account/password}" method="post" class="row g-3">
                <div class="col-md-4" th:each="pw : ${ { {'current', 'Mật khẩu hiện tại'}, {'password', 'Mật khẩu mới'}, {'password_confirmation', 'Nhập lại'} } }">
                    <label class="form-label" th:text="${pw[1]}"></label>
                    <div class="input-group"><input class="form-control" type="password" th:name="${pw[0]}" required th:minlength="${pw[0] != 'current'} ? 6 : null">
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1"><i class="bi bi-eye"></i></button></div></div>
                <div class="col-12"><button class="btn btn-outline-primary">Đổi mật khẩu</button></div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
