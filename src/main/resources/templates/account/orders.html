<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/account :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex flex-wrap gap-2 mb-3 filter-chips">
        <a th:href="@{/account/orders}" th:class="'btn btn-sm ' + (${status == null} ? 'btn-primary' : 'btn-outline-secondary')">Tất cả</a>
        <a th:each="s : ${statuses}" th:href="@{/account/orders(status=${s.name()})}" th:class="'btn btn-sm ' + (${status == s} ? 'btn-primary' : 'btn-outline-secondary')" th:text="${s.label}"></a>
    </div>
    <div th:if="${orders.isEmpty()}" class="card card-body text-center text-muted py-5"><i class="bi bi-receipt fs-1"></i><p class="mt-2 mb-0">Chưa có đơn hàng.</p></div>
    <div class="card mb-3" th:each="o : ${orders.items}">
        <div class="card-body d-flex flex-wrap justify-content-between gap-3">
            <div>
                <div class="fw-semibold"><a th:href="@{/account/orders/{c}(c=${o.code})}" th:text="${o.code}"></a>
                    <th:block th:replace="~{partials/misc :: status(${o.status})}"/>
                    <span th:if="${o.returnStatus != null}" th:class="'badge text-bg-' + ${o.returnStatus.color}" th:text="${o.returnStatus.label}"></span>
                </div>
                <div class="small text-muted" th:text="${@h.dt(o.createdAt)} + ' · ' + ${o.items.size()} + ' sản phẩm'"></div>
                <div class="small" th:text="${#strings.listJoin(o.items.![productName], ', ')}"></div>
            </div>
            <div class="text-end">
                <div class="price" th:text="${@h.money(o.total)}"></div>
                <span th:class="'badge text-bg-' + ${o.paymentStatus.color}" th:text="${o.paymentStatus.label}"></span>
                <div class="mt-2"><a th:href="@{/account/orders/{c}(c=${o.code})}" class="btn btn-sm btn-outline-primary">Chi tiết</a></div>
            </div>
        </div>
    </div>
    <th:block th:replace="~{partials/pagination :: links(${orders})}"/>
</th:block>
</body>
</html>
