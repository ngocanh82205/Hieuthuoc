<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="row g-4">
        <div class="col-xl-8">
            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Nhà cung cấp</th><th>Liên hệ</th><th class="text-end">Phiếu nhập</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="s : ${list}"><td><div class="fw-semibold" th:text="${s.name}"></div><div class="small text-muted" th:text="'MST ' + (${s.taxCode} ?: '-')"></div></td>
                            <td class="small"><th:block th:text="${s.phone}"/><div th:text="${s.email}"></div></td>
                            <td class="text-end" th:text="${receipts.getOrDefault(s.id, 0L)}"></td>
                            <td class="text-nowrap"><a th:href="@{/admin/suppliers(edit=${s.id})}" class="btn btn-sm btn-light">Sửa</a></td></tr>
                        <tr th:if="${list.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">Chưa có nhà cung cấp.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-xl-4">
            <form th:action="${edit != null} ? @{/admin/suppliers-save/{id}(id=${edit.id})} : @{/admin/suppliers-save}" method="post" class="card">
                <div class="card-header" th:text="${edit != null} ? 'Sửa nhà cung cấp' : 'Thêm nhà cung cấp'"></div>
                <div class="card-body row g-2">
                    <div class="col-12"><label class="form-label small" for="sName">Tên</label><input id="sName" name="name" class="form-control" required maxlength="200" th:value="${edit != null} ? ${edit.name} : ''"></div>
                    <div class="col-6"><label class="form-label small" for="sPhone">Điện thoại</label><input id="sPhone" name="phone" class="form-control" maxlength="20" th:value="${edit != null} ? ${edit.phone} : ''"></div>
                    <div class="col-6"><label class="form-label small" for="sTax">Mã số thuế</label><input id="sTax" name="tax_code" class="form-control" maxlength="20" th:value="${edit != null} ? ${edit.taxCode} : ''"></div>
                    <div class="col-12"><label class="form-label small" for="sEmail">Email</label><input id="sEmail" type="email" name="email" class="form-control" maxlength="150" th:value="${edit != null} ? ${edit.email} : ''"></div>
                    <div class="col-12"><label class="form-label small" for="sAddr">Địa chỉ</label><input id="sAddr" name="address" class="form-control" maxlength="300" th:value="${edit != null} ? ${edit.address} : ''"></div>
                </div>
                <div class="card-footer bg-white"><button class="btn btn-primary">Lưu</button><a th:if="${edit != null}" th:href="@{/admin/suppliers}" class="btn btn-link">Hủy</a></div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
