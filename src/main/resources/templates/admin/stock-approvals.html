<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <h2 class="h6 fw-bold mb-2"><i class="bi bi-truck"></i> <th:block th:text="'Phiếu nhập chờ duyệt (' + ${receipts.size()} + ')'"/></h2>
    <div class="card mb-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Mã phiếu</th><th>Nhà cung cấp</th><th>Hàng nhập</th><th class="text-end">Giá trị</th><th>Người lập</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${receipts}"><td><a th:href="@{/staff/receipts/{id}(id=${r.id})}" class="fw-semibold" th:text="${r.code}"></a><div class="small text-muted" th:text="${@h.dt(r.createdAt)}"></div></td>
                    <td class="small" th:text="${r.supplier != null} ? ${r.supplier.name} : '-'"></td>
                    <td class="small"><div th:each="it : ${r.items}" th:text="${it.product.name} + ' · lô ' + ${it.batchNo} + ' · ' + ${@h.num(it.quantity)} + ' (HSD ' + ${@h.date(it.expDate)} + ')'"></div></td>
                    <td class="text-end" th:text="${@h.money(r.total())}"></td><td class="small" th:text="${r.creator != null} ? ${r.creator.fullName} : ''"></td>
                    <td class="text-nowrap"><form th:action="@{/staff/receipts/{id}/decide(id=${r.id})}" method="post" class="d-flex gap-1">
                        <input type="hidden" name="back" value="/admin/stock-approvals">
                        <button name="decision" value="approve" class="btn btn-sm btn-success">Duyệt</button>
                        <button name="decision" value="reject" class="btn btn-sm btn-outline-danger" th:data-confirm="'Từ chối phiếu nhập ' + ${r.code} + '?'">Từ chối</button></form></td></tr>
                <tr th:if="${receipts.isEmpty()}"><td colspan="6" class="text-center text-muted py-3">Không có phiếu nhập chờ duyệt.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <h2 class="h6 fw-bold mb-2"><i class="bi bi-trash3"></i> <th:block th:text="'Phiếu hủy / điều chỉnh / kiểm kê chờ duyệt (' + ${adjustments.size()} + ')'"/></h2>
    <th:block th:replace="~{staff/_parts :: adjustmentTable(${adjustments}, '/admin/stock-approvals')}"/>
</th:block>
</body>
</html>
