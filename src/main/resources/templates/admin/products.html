<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form class="card card-body mb-3" method="get" th:action="@{/admin/products}">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4"><input name="q" class="form-control form-control-sm" th:value="${q}" placeholder="Tên, hoạt chất, số đăng ký"></div>
                    <div class="col-md-3"><select name="category" class="form-select form-select-sm">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${category == c.id}"></option></select></div>
                    <div class="col-md-3"><select name="type" class="form-select form-select-sm">
                        <option value="">Tất cả loại</option>
                        <option th:each="t : ${drugTypes}" th:value="${t}" th:text="${t.label}" th:selected="${type == t}"></option></select></div>
                    <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary btn-sm flex-grow-1">Lọc</button>
                        <a th:href="@{/admin/products/new}" class="btn btn-success btn-sm" title="Thêm sản phẩm"><i class="bi bi-plus-lg"></i></a></div>
                </div>
            </form>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Loại</th><th class="text-end">Giá bán</th><th class="text-end">Tồn</th><th class="text-end">Đã bán</th><th>Trạng thái</th><th></th></tr></thead>
                        <tbody>
                        <tr th:if="${page.empty}"><td colspan="8" class="text-center text-muted py-4">Không có sản phẩm.</td></tr>
                        <tr th:each="p : ${page.content}">
                            <td><div class="fw-semibold" th:text="${p.name}"></div><small class="text-muted" th:text="${p.activeIngredient}"></small></td>
                            <td class="small" th:text="${p.category != null ? p.category.name : '-'}"></td>
                            <td><span class="badge" th:classappend="'text-bg-' + ${p.drugType.color}" th:text="${p.drugType.shortLabel}"></span></td>
                            <td class="text-end text-nowrap" th:text="${@fmt.money(p.price)} + '/' + ${p.unit}"></td>
                            <td class="text-end" th:classappend="${p.lowStock} ? 'text-danger fw-semibold'" th:text="${p.onHand}"></td>
                            <td class="text-end" th:text="${p.sold}"></td>
                            <td><span class="badge" th:classappend="${p.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${p.active} ? 'Đang bán' : 'Ngừng bán'"></span></td>
                            <td class="text-nowrap">
                                <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                                <a th:href="@{/staff/inventory/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary" title="Lô hàng"><i class="bi bi-box-seam"></i></a>
                                <form th:action="@{/admin/products/{id}/toggle(id=${p.id})}" method="post" class="d-inline">
                                    <button class="btn btn-sm btn-outline-dark" th:text="${p.active} ? 'Ẩn' : 'Bán lại'"></button></form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav th:replace="~{fragments/layout :: pagination(${page})}"></nav>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
