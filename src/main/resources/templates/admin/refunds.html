<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="card mb-4">
        <div class="card-header" th:text="'Chờ hoàn tiền (' + ${pending.size()} + ')'"></div>
        <div class="table-responsive"><table class="table mb-0 align-middle">
            <thead><tr><th>Đơn</th><th>Khách</th><th>Thanh toán</th><th class="text-end">Đã thu</th><th style="min-width:360px">Hoàn tiền</th></tr></thead>
            <tbody>
            <tr th:each="o : ${pending}">
                <td><a th:href="@{/staff/orders/{id}(id=${o.id})}" class="fw-semibold" th:text="${o.code}"></a><div class="small"><th:block th:replace="~{partials/misc :: status(${o.status})}"/></div></td>
                <td><th:block th:text="${o.recipient}"/><div class="small text-muted" th:text="${o.phone}"></div></td>
                <td class="small" th:text="${o.paymentMethod.label}"></td>
                <td class="text-end" th:text="${@h.money(o.total)}"></td>
                <td><form th:action="@{/staff/orders/{id}/refund(id=${o.id})}" method="post" class="d-flex gap-2"><input type="hidden" name="back" value="refunds">
                    <input type="number" name="amount" class="form-control form-control-sm" style="width:130px" th:value="${o.refundAmount} ?: ${o.total}" min="1" th:max="${o.total}">
                    <input name="note" class="form-control form-control-sm" placeholder="Hình thức / mã GD hoàn" required>
                    <button class="btn btn-sm btn-primary text-nowrap">Đã hoàn</button></form></td>
            </tr>
            <tr th:if="${pending.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">Không có đơn chờ hoàn tiền.</td></tr>
            </tbody></table></div>
    </div>
    <div class="card">
        <div class="card-header">Đã hoàn gần đây</div>
        <div class="table-responsive"><table class="table table-sm mb-0">
            <thead><tr><th>Đơn</th><th>Khách</th><th class="text-end">Số tiền hoàn</th><th>Ghi chú</th><th>Thời điểm</th></tr></thead>
            <tbody><tr th:each="o : ${done}"><td><a th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a></td><td th:text="${o.recipient}"></td>
                <td class="text-end" th:text="${@h.money(o.refundAmount)}"></td><td class="small" th:text="${o.refundNote}"></td><td class="small" th:text="${@h.dt(o.refundedAt)}"></td></tr></tbody>
        </table></div>
    </div>
</th:block>
</body>
</html>
