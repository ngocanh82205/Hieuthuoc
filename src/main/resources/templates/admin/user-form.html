<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<th:block th:with="u=${user}, isNew=${user.id == null}, canDelete=${user.id != null and user.id != currentUser.id}">
    <form th:action="${isNew} ? @{/admin/users} : @{/admin/users/{id}(id=${u.id})}" method="post" class="row g-4">
        <div class="col-xl-7">
            <div class="card mb-4">
                <div class="card-header">Thông tin</div>
                <div class="card-body row g-3">
                    <div class="col-md-6"><label class="form-label" for="uName">Họ tên</label><input id="uName" name="full_name" class="form-control" required maxlength="100" th:value="${old['full_name']} ?: ${u.fullName}"></div>
                    <div class="col-md-6"><label class="form-label" for="uEmail">Email (đăng nhập)</label><input id="uEmail" type="email" name="email" class="form-control" required th:value="${old['email']} ?: ${u.email}"></div>
                    <div class="col-md-6"><label class="form-label" for="uPhone">Điện thoại</label><input id="uPhone" name="phone" class="form-control" maxlength="20" th:value="${old['phone']} ?: ${u.phone}"></div>
                    <div class="col-md-6"><label class="form-label" for="uPw" th:text="${isNew} ? 'Mật khẩu' : 'Mật khẩu mới (để trống nếu không đổi)'"></label>
                        <input id="uPw" type="password" name="password" class="form-control" minlength="6" autocomplete="new-password" th:required="${isNew}"></div>
                    <div class="col-md-6"><label class="form-label" for="uRole">Loại tài khoản</label>
                        <select id="uRole" name="role" class="form-select">
                            <option value="PHARMACIST" th:selected="${u.role.name() == 'PHARMACIST'}">Dược sĩ / nhân viên</option>
                            <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">Quản trị viên (toàn quyền)</option>
                        </select></div>
                    <div class="col-md-6"><label class="form-label" for="uLic">Số chứng chỉ hành nghề dược (CCHN)</label><input id="uLic" name="license_no" class="form-control" maxlength="50" th:value="${old['license_no']} ?: ${u.licenseNo}"></div>
                    <div class="col-md-6"><label class="form-label" for="uDeg">Trình độ chuyên môn</label><input id="uDeg" name="degree" class="form-control" maxlength="200" th:value="${old['degree']} ?: ${u.degree}" placeholder="VD: Dược sĩ đại học"></div>
                </div>
            </div>
        </div>
        <div class="col-xl-5">
            <div class="card mb-3">
                <div class="card-header">Quyền theo loại tài khoản</div>
                <div class="card-body small">
                    <div class="fw-semibold mb-1">Dược sĩ / nhân viên</div>
                    <ul class="mb-2"><li th:each="p : ${pharmacistPerms}" th:text="${p.label}"></li></ul>
                    <div class="fw-semibold mb-1">Quản trị viên</div>
                    <p class="mb-2">Toàn quyền, gồm cả duyệt phiếu kho và hoàn tiền.</p>
                    <p class="text-muted mb-0">Dược sĩ duyệt đơn thuốc kê đơn nên bắt buộc có số CCHN.</p>
                </div>
            </div>
            <button class="btn btn-primary">Lưu</button> <a th:href="@{/admin/users}" class="btn btn-link">Hủy</a>
            <th:block th:if="${canDelete}">
                <button form="deleteStaffForm" class="btn btn-outline-danger float-end" th:data-confirm="'Xóa vĩnh viễn nhân viên ' + ${u.fullName} + '?'"><i class="bi bi-trash"></i> Xóa nhân viên</button>
                <div class="small text-muted mt-2 clearfix">Chỉ xóa được tài khoản chưa có hoạt động nghiệp vụ; nhân viên đã làm việc hãy dùng "Khóa".</div>
            </th:block>
        </div>
    </form>
    <form th:if="${canDelete}" th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" id="deleteStaffForm" class="d-none"></form>
</th:block>
</th:block>
</body>
</html>
