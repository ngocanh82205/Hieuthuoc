<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <ul class="nav nav-pills mb-3">
        <li class="nav-item"><a th:class="'nav-link ' + (${handled} ? '' : 'active')" th:href="@{/admin/password-resets}">Chờ xử lý</a></li>
        <li class="nav-item"><a th:class="'nav-link ' + (${handled} ? 'active' : '')" th:href="@{/admin/password-resets(handled=1)}">Đã xử lý</a></li>
    </ul>
    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Thời gian</th><th>Tài khoản khai báo</th><th>Tài khoản tìm thấy</th><th>SĐT liên hệ</th><th>Ghi chú</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${list}"><td class="small" th:text="${@h.dt(r.createdAt)}"></td><td th:text="${r.identifier}"></td>
                    <td class="small"><th:block th:if="${r.user != null}"><th:block th:text="${r.user.fullName}"/><div class="text-muted" th:text="${r.user.email} ?: ${r.user.phone}"></div></th:block>
                        <span th:if="${r.user == null}" class="text-danger">Không khớp tài khoản</span></td>
                    <td><a th:href="'tel:' + ${r.contactPhone}" th:text="${r.contactPhone}"></a></td><td class="small" th:text="${r.note}"></td>
                    <td class="text-nowrap">
                        <span th:if="${handled}" class="small text-muted" th:text="(${r.handler != null} ? ${r.handler.fullName} : '') + ' · ' + ${@h.dt(r.handledAt)}"></span>
                        <th:block th:unless="${handled}">
                            <form th:if="${r.user != null}" th:action="@{/admin/users/{id}/reset-password(id=${r.user.id})}" method="post" class="d-inline"
                                  th:data-confirm="'Xác minh qua điện thoại xong? Đặt lại mật khẩu cho ' + ${r.user.fullName} + '.'">
                                <input type="hidden" name="request_id" th:value="${r.id}"><button class="btn btn-sm btn-primary">Đặt lại mật khẩu</button></form>
                            <form th:action="@{/admin/password-resets/{id}/close(id=${r.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-outline-secondary">Đóng</button></form>
                        </th:block>
                    </td></tr>
                <tr th:if="${list.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">Không có yêu cầu.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small text-muted mt-2">Gọi lại số liên hệ để xác minh chủ tài khoản trước khi đặt lại mật khẩu; mật khẩu tạm hiện một lần để đọc cho khách.</p>
</th:block>
</body>
</html>
