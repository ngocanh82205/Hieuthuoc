<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="card mb-4">
        <div class="card-body small d-flex flex-wrap gap-3 align-items-center">
            <span class="fw-semibold">Tích hợp (cấu hình qua biến môi trường):</span>
            <span th:each="e : ${integrations}"><i th:class="'bi ' + (${e.value} ? 'bi-check-circle-fill text-success' : 'bi-dash-circle text-muted')"></i>
                <th:block th:text="${e.key} + (${e.value} ? '' : ' (chưa cấu hình)')"/></span>
        </div>
    </div>
    <form th:action="@{/admin/settings}" method="post" style="max-width: 1000px">
        <div class="card mb-4" th:each="g : ${groups}">
            <div class="card-header fw-semibold" th:text="${g.key}"></div>
            <div class="card-body row g-3">
                <th:block th:each="k : ${g.value}" th:with="label=${labels.get(k)} ?: ${k}">
                    <div th:if="${booleans.contains(k)}" class="col-md-6"><input type="hidden" th:name="'_bool_' + ${k}" value="1">
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:name="${k}" value="1" th:id="'s_' + ${k}" th:checked="${cfg.get(k) == '1'}">
                            <label class="form-check-label" th:for="'s_' + ${k}" th:text="${label}"></label></div></div>
                    <div th:if="${textareas.contains(k)}" class="col-12"><label class="form-label small" th:for="'s_' + ${k}" th:text="${label}"></label>
                        <textarea th:id="'s_' + ${k}" th:name="${k}" rows="3" class="form-control" th:text="${cfg.get(k)}"></textarea></div>
                    <div th:if="${!booleans.contains(k) and !textareas.contains(k)}" class="col-md-6"><label class="form-label small" th:for="'s_' + ${k}" th:text="${label}"></label>
                        <input th:id="'s_' + ${k}" th:name="${k}" class="form-control" th:value="${cfg.get(k)}" th:type="${numerics.contains(k)} ? 'number' : 'text'" th:min="${numerics.contains(k)} ? 0 : null"></div>
                </th:block>
            </div>
        </div>
        <div class="position-sticky bottom-0 bg-body py-2"><button class="btn btn-primary"><i class="bi bi-save"></i> Lưu cấu hình</button></div>
    </form>
</th:block>
</body>
</html>
