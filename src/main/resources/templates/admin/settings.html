<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form th:action="@{/admin/settings}" method="post" class="card" style="max-width: 820px">
                <div class="card-body row g-3">
                    <div class="col-md-6" th:each="e : ${labels}">
                        <label class="form-label small fw-semibold" th:for="${e.key}" th:text="${e.value}"></label>
                        <input class="form-control" th:id="${e.key}" th:name="${e.key}" th:value="${values[e.key]}"
                               th:type="${numeric.contains(e.key)} ? 'number' : 'text'" th:min="${numeric.contains(e.key)} ? 0 : null">
                    </div>
                </div>
                <div class="card-footer bg-white"><button class="btn btn-primary">Lưu cấu hình</button></div>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
