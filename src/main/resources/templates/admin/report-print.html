<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/print :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
<th:block th:with="r=${report}">
    <div class="d-flex justify-content-between mb-3">
        <div><div class="fw-bold fs-5" th:text="${settings['store_name']}"></div><div class="small" th:text="${settings['store_address']}"></div></div>
        <div class="text-end"><h1 class="h5 fw-bold mb-0">BÁO CÁO KINH DOANH</h1><div class="small" th:text="'Từ ' + ${@h.date(from)} + ' đến ' + ${@h.date(to)}"></div>
            <div class="small text-muted" th:text="'In lúc ' + ${@h.dt(printedAt)}"></div></div>
    </div>
    <th:block th:replace="~{admin/_report :: body(${r})}"/>
    <h2 class="h6 fw-bold">Doanh thu theo ngày</h2>
    <table class="table table-sm table-bordered"><thead><tr><th>Ngày</th><th class="text-end">Số đơn</th><th class="text-end">Doanh thu</th></tr></thead><tbody>
        <tr th:each="e : ${r.byDay}"><td th:text="${@h.date(e.key)}"></td><td class="text-end" th:text="${e.value[0]}"></td><td class="text-end" th:text="${@h.money(e.value[1])}"></td></tr>
    </tbody></table>
    <div class="row">
        <div class="col-6"><h2 class="h6 fw-bold">Theo danh mục</h2><table class="table table-sm table-bordered"><tbody>
            <tr th:each="e : ${r.byCategory}"><td th:text="${e.key}"></td><td class="text-end" th:text="${@h.money(e.value)}"></td></tr></tbody></table></div>
        <div class="col-6"><h2 class="h6 fw-bold">Theo phương thức thanh toán</h2><table class="table table-sm table-bordered"><tbody>
            <tr th:each="e : ${r.byPayment}"><td th:text="${e.key}"></td><td class="text-end" th:text="${e.value[0]}"></td><td class="text-end" th:text="${@h.money(e.value[1])}"></td></tr></tbody></table></div>
    </div>
    <h2 class="h6 fw-bold">Top sản phẩm bán chạy</h2>
    <table class="table table-sm table-bordered"><tbody><tr th:each="t, s : ${r.topProducts}"><td th:text="${s.count} + '. ' + ${t.name()}"></td>
        <td class="text-end" th:text="${@h.num(t.quantity())} + ' ' + ${t.unit()}"></td><td class="text-end" th:text="${@h.money(t.revenue())}"></td></tr></tbody></table>
    <th:block th:replace="~{admin/_report :: tables(${r}, ${inventory}, ${nearDays})}"/>
</th:block>
</th:block>
</body>
</html>
