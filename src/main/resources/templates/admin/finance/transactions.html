<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <th:block th:replace="~{admin/finance/_filter :: filter('/admin/finance/transactions')}"/>
    <div class="d-flex justify-content-between align-items-center mb-2" th:with="xl=${@h.query('export', 'xlsx', 'page', null)}">
        <div class="small text-muted" th:text="${orders.total} + ' đơn hàng'"></div>
        <a th:href="${xl}" class="btn btn-sm btn-success"><i class="bi bi-file-earmark-excel"></i> Xuất Excel</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0 align-middle">
                <thead th:with="dCode=${sort == 'code' and dir == 'desc'} ? 'asc' : 'desc', dCreated=${sort == 'createdAt' and dir == 'desc'} ? 'asc' : 'desc',
                                dTotal=${sort == 'total' and dir == 'desc'} ? 'asc' : 'desc', arrow=${dir == 'asc'} ? ' ▲' : ' ▼',
                                uCode=${@h.query('sort', 'code', 'dir', dCode, 'page', null)}, uCreated=${@h.query('sort', 'createdAt', 'dir', dCreated, 'page', null)},
                                uTotal=${@h.query('sort', 'total', 'dir', dTotal, 'page', null)}">
                <tr><th><a th:href="${uCode}" class="text-reset" th:text="'Mã đơn' + (${sort == 'code'} ? ${arrow} : '')"></a></th><th>Người nhận</th>
                    <th><a th:href="${uCreated}" class="text-reset" th:text="'Ngày tạo' + (${sort == 'createdAt'} ? ${arrow} : '')"></a></th>
                    <th class="text-end"><a th:href="${uTotal}" class="text-reset" th:text="'Tổng tiền' + (${sort == 'total'} ? ${arrow} : '')"></a></th>
                    <th>Phương thức</th><th>Thanh toán</th><th>Giao dịch</th><th>Đơn hàng</th><th></th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders.items}" th:with="t=${reps.get(o.id)}">
                    <td><a th:href="@{/staff/orders/{id}(id=${o.id})}" class="fw-semibold" th:text="${o.code}"></a></td>
                    <td><th:block th:text="${o.recipient}"/><div class="small text-muted" th:text="${o.phone}"></div></td>
                    <td class="small" th:text="${@h.dt(o.createdAt)}"></td>
                    <td class="text-end fw-semibold" th:text="${@h.money(o.total)}"></td>
                    <td class="small" th:text="${o.paymentMethod.shortLabel}"></td>
                    <td><span th:class="'badge text-bg-' + ${o.paymentStatus.color}" th:text="${o.paymentStatus.label}"></span></td>
                    <td class="small"><th:block th:if="${t != null}"><th:block th:text="${t.transactionId} ?: '-'"/><div class="text-muted" th:text="${t.paidAt != null} ? ${@h.dt(t.paidAt)} : ${t.status}"></div></th:block>
                        <span th:if="${t == null}" class="text-muted">-</span></td>
                    <td><th:block th:replace="~{partials/misc :: status(${o.status})}"/></td>
                    <td>
                        <form th:if="${o.canMarkPaid() and (o.paymentMethod.name() == 'COD' or o.paymentMethod.name() == 'BANK_TRANSFER')}" th:action="@{/admin/finance/orders/{id}/cod(id=${o.id})}" method="post"
                              th:with="tot=${@h.money(o.total)}" th:data-confirm="'Xác nhận đã thu ' + ${tot} + ' cho đơn ' + ${o.code} + '?'">
                            <button class="btn btn-sm btn-outline-success text-nowrap"><i class="bi bi-check2"></i> Đã thu</button></form>
                    </td>
                </tr>
                <tr th:if="${orders.isEmpty()}"><td colspan="9" class="text-center text-muted py-4">Không có giao dịch phù hợp.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><th:block th:replace="~{partials/pagination :: links(${orders})}"/></div>
</th:block>
</body>
</html>
