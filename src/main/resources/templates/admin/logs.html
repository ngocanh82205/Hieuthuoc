<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <form method="get" th:action="@{/admin/logs}" class="card card-body mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3"><label class="form-label small" for="lUser">Người thực hiện</label>
                <select id="lUser" name="user_id" class="form-select form-select-sm"><option value="">Tất cả</option>
                    <option th:each="s : ${staff}" th:value="${s.id}" th:selected="${f['user_id'] == s.id.toString()}" th:text="${s.fullName}"></option></select></div>
            <div class="col-md-2"><label class="form-label small" for="lAction">Nhóm thao tác</label>
                <select id="lAction" name="action" class="form-select form-select-sm"><option value="">Tất cả</option>
                    <option th:each="a : ${actions}" th:value="${a}" th:selected="${f['action'] == a}" th:text="${a}"></option></select></div>
            <div class="col-md-3"><label class="form-label small" for="lQ">Nội dung</label><input id="lQ" name="q" th:value="${f['q']}" class="form-control form-control-sm"></div>
            <div class="col-md-2"><label class="form-label small" for="lFrom">Từ ngày</label><input id="lFrom" type="date" name="from" th:value="${f['from']}" class="form-control form-control-sm"></div>
            <div class="col-md-2"><label class="form-label small" for="lTo">Đến ngày</label><input id="lTo" type="date" name="to" th:value="${f['to']}" class="form-control form-control-sm"></div>
            <div class="col-12"><button class="btn btn-sm btn-primary">Lọc</button> <a th:href="@{/admin/logs}" class="btn btn-sm btn-link">Xóa lọc</a></div>
        </div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Chi tiết</th><th>Địa chỉ IP</th></tr></thead>
                <tbody>
                <tr th:each="l : ${page.items}"><td class="small text-nowrap" th:text="${@h.dt(l.createdAt)}"></td><td class="small" th:text="${l.user != null} ? ${l.user.fullName} : 'Hệ thống'"></td>
                    <td><div class="small fw-semibold" th:text="${l.actionLabel()}"></div><div th:if="${l.groupLabel() != null}" class="small text-muted" th:text="${l.groupLabel()}"></div></td>
                    <td class="small" th:text="${l.detail}"></td><td class="small text-muted" th:title="${l.ip}" th:text="${l.ipLabel()}"></td></tr>
                <tr th:if="${page.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">Không có nhật ký.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3"><th:block th:replace="~{partials/pagination :: links(${page})}"/></div>
</th:block>
</body>
</html>
