<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{::scripts})}">
<body>
<th:block th:fragment="content">
    <div class="row g-3 mb-4" th:with="m1=${@h.money(revenueToday)}, m2=${@h.money(revenueMonth)}, m3=${@h.money(paidOnlineToday)}, m4=${@h.money(inventoryValue)}">
        <th:block th:replace="~{staff/_parts :: stat('/admin/reports', 'green', 'bi-cash-stack', ${m1}, 'Doanh thu hôm nay (tiền hàng, không gồm phí ship)')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/admin/reports', 'blue', 'bi-calendar-month', ${m2}, 'Doanh thu thuần tháng này (đã trừ hàng trả)')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/staff/orders', 'violet', 'bi-receipt', ${ordersToday}, 'Đơn mới hôm nay · ' + ${processing} + ' đang xử lý')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/admin/customers', 'amber', 'bi-people', ${customers}, 'Khách hàng (+' + ${newCustomers} + ' trong 30 ngày)')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/admin/finance', 'green', 'bi-wallet2', ${m3}, 'Tiền đã thu hôm nay (giao dịch)')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/staff/inventory', 'blue', 'bi-box-seam', ${m4}, 'Giá trị tồn kho (giá nhập)')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/admin/stock-approvals', 'red', 'bi-truck', ${pendingReceipts}, 'Phiếu nhập chờ duyệt')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/staff/prescriptions', 'red', 'bi-file-earmark-medical', ${pendingRx}, 'Đơn thuốc chờ duyệt')}"/>
        <th:block th:replace="~{staff/_parts :: stat('/admin/password-resets', 'amber', 'bi-key', ${pendingResets}, 'Yêu cầu quên mật khẩu')}"/>
    </div>
    <div class="row g-4">
        <div class="col-xl-8">
            <div class="card h-100">
                <div class="card-header">Doanh thu 14 ngày gần nhất (tiền hàng, đã trừ hàng trả)</div>
                <div class="card-body"><div class="chart-box"><canvas id="revChart" aria-label="Biểu đồ doanh thu 14 ngày" role="img"></canvas></div></div>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header">Đơn hàng theo trạng thái</div>
                <ul class="list-group list-group-flush">
                    <th:block th:each="s : ${statuses}">
                        <li th:if="${statusCounts.getOrDefault(s.name(), 0L) > 0}" class="list-group-item d-flex justify-content-between">
                            <a th:href="@{/staff/orders(status=${s.name()})}"><th:block th:replace="~{partials/misc :: status(${s})}"/></a><strong th:text="${statusCounts.get(s.name())}"></strong></li>
                    </th:block>
                </ul>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header">Doanh thu theo phương thức thanh toán (30 ngày)</div>
                <ul class="list-group list-group-flush">
                    <li th:each="e : ${byPayment}" class="list-group-item d-flex justify-content-between"><span><th:block th:text="${e.key}"/> <small class="text-muted" th:text="'(' + ${e.value[0]} + ' đơn)'"></small></span><strong th:text="${@h.money(e.value[1])}"></strong></li>
                    <li th:if="${byPayment.isEmpty()}" class="list-group-item text-muted">Chưa có dữ liệu.</li>
                </ul>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header">Top sản phẩm bán chạy (30 ngày)</div>
                <table class="table mb-0 small">
                    <thead><tr><th>Sản phẩm</th><th class="text-end">SL</th><th class="text-end">Doanh thu</th></tr></thead>
                    <tbody><tr th:each="t : ${top}"><td th:text="${t.name()}"></td><td class="text-end" th:text="${t.quantity()}"></td><td class="text-end" th:text="${@h.money(t.revenue())}"></td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between">Sắp hết hàng <a th:href="@{/staff/inventory/alerts}" class="small">Cảnh báo kho</a></div>
                <ul class="list-group list-group-flush">
                    <li th:each="p : ${lowStock}" class="list-group-item d-flex justify-content-between"><span th:text="${p.name}"></span>
                        <span class="text-danger fw-semibold" th:text="${p.available} + '/' + ${p.minStock} + ' ' + ${p.unit}"></span></li>
                    <li th:if="${lowStock.isEmpty()}" class="list-group-item text-muted">Không có sản phẩm dưới định mức.</li>
                </ul>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="scripts">
<script th:src="@{/vendor/chartjs/chart.umd.js}"></script>
<script th:src="@{/js/charts.js}"></script>
<script th:inline="javascript">
    vpBar(document.getElementById('revChart'), /*[[${chartLabels}]]*/ [], /*[[${chartRevenue}]]*/ [], {money: true, label: 'Doanh thu', extra: {label: 'Số đơn', values: /*[[${chartOrders}]]*/ []}});
</script>
</th:block>
</body>
</html>
