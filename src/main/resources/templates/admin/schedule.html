<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff :: sidebar}"></aside>
    <div class="staff-main">
        <header th:replace="~{fragments/staff :: topbar}"></header>
        <main class="p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/schedule(week=${monday.minusWeeks(1)})}"><i class="bi bi-chevron-left"></i> Tuần trước</a>
                <span class="fw-semibold" th:text="'Tuần ' + ${#temporals.format(monday, 'dd/MM')} + ' - ' + ${#temporals.format(monday.plusDays(6), 'dd/MM/yyyy')}"></span>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/schedule(week=${monday.plusWeeks(1)})}">Tuần sau <i class="bi bi-chevron-right"></i></a>
                <a class="btn btn-sm btn-link" th:href="@{/admin/schedule}">Tuần này</a>
                <form th:action="@{/admin/schedule/copy}" method="post" class="ms-auto" data-confirm="Sao chép toàn bộ lịch tuần này sang tuần sau?">
                    <input type="hidden" name="from" th:value="${monday}">
                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-copy"></i> Sao chép sang tuần sau</button></form>
                <a th:href="@{/admin/attendance}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-fingerprint"></i> Chấm công</a>
                <a th:href="@{/admin/shifts}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-clock"></i> Ca làm</a>
            </div>
            <form th:action="@{/admin/schedule}" method="post" class="card card-body mb-3" id="assignForm">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3"><label class="form-label small">Nhân viên</label>
                        <select name="userId" class="form-select form-select-sm" required>
                            <option th:each="u : ${staff}" th:value="${u.id}" th:text="${u.fullName}"></option></select></div>
                    <div class="col-md-2"><label class="form-label small">Ngày</label><input type="date" name="date" class="form-control form-control-sm" th:value="${today}" required></div>
                    <div class="col-md-3"><label class="form-label small">Ca</label>
                        <select name="shiftId" class="form-select form-select-sm" required>
                            <option th:each="s : ${shifts}" th:value="${s.id}" th:text="${s.name} + ' (' + ${s.timeRange} + ')'"></option></select></div>
                    <div class="col-md-2"><label class="form-label small">Ghi chú</label><input name="note" class="form-control form-control-sm"></div>
                    <div class="col-md-2"><button class="btn btn-sm btn-primary w-100"><i class="bi bi-plus"></i> Xếp ca</button></div>
                </div>
                <div class="small text-muted mt-2">Bấm dấu <i class="bi bi-plus-circle"></i> trong ô lịch để chọn nhanh nhân viên và ngày.</div>
            </form>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-bordered align-top mb-0 schedule-grid">
                        <thead><tr><th style="min-width: 170px">Nhân viên</th>
                            <th th:each="d, ds : ${days}" class="text-center" th:classappend="${d == today} ? 'table-primary'">
                                <div th:text="${dayNames[ds.index]}"></div>
                                <div class="small fw-normal" th:text="${#temporals.format(d, 'dd/MM')}"></div></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${staff}">
                            <td><div class="fw-semibold" th:text="${u.fullName}"></div>
                                <div class="small text-muted" th:text="${u.positionLabel}"></div>
                                <div class="small" th:text="${hours[u.id] != null ? #numbers.formatDecimal(hours[u.id], 1, 1) + ' giờ / tuần' : '0 giờ / tuần'}"></div></td>
                            <td th:each="d : ${days}" th:with="list=${cells[u.id + '_' + d.toString()]}" th:classappend="${d == today} ? 'table-primary-subtle'">
                                <div th:each="a : ${list}" class="shift-chip" th:classappend="'border-' + ${a.shift.color}">
                                    <div class="d-flex justify-content-between align-items-start gap-1">
                                        <span class="fw-semibold small" th:classappend="'text-' + ${a.shift.color}" th:text="${a.shift.name}"></span>
                                        <form th:if="${a.checkInAt == null}" th:action="@{/admin/schedule/{id}/delete(id=${a.id})}" method="post">
                                            <input type="hidden" name="week" th:value="${monday}">
                                            <button class="btn btn-link btn-sm p-0 text-muted" title="Bỏ ca"><i class="bi bi-x"></i></button></form>
                                    </div>
                                    <div class="small text-muted" th:text="${a.shift.timeRange}"></div>
                                    <span class="badge" th:classappend="'text-bg-' + ${a.attendance[1]}" th:text="${a.attendance[0]}"></span>
                                </div>
                                <button type="button" class="btn btn-link btn-sm p-0 quick-assign" th:attr="data-user=${u.id},data-date=${d}" title="Xếp ca">
                                    <i class="bi bi-plus-circle"></i></button>
                            </td>
                        </tr>
                        <tr th:if="${staff.isEmpty()}"><td colspan="8" class="text-center text-muted py-4">Chưa có dược sĩ / nhân viên.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <script>
                document.querySelectorAll('.quick-assign').forEach(function (b) {
                    b.addEventListener('click', function () {
                        var f = document.getElementById('assignForm');
                        f.querySelector('[name=userId]').value = b.dataset.user;
                        f.querySelector('[name=date]').value = b.dataset.date;
                        f.scrollIntoView({behavior: 'smooth', block: 'center'});
                        f.querySelector('[name=shiftId]').focus();
                    });
                });
            </script>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
