<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <p class="small text-muted">Hệ thống cảnh báo cho dược sĩ khi tư vấn / duyệt đơn / bán tại quầy nếu khách mua (hoặc đã mua trong 90 ngày) hai thuốc có thành phần chứa từ khóa A và B.
        Đây là công cụ hỗ trợ, không thay thế tra cứu chuyên môn.</p>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Hoạt chất A</th><th>Hoạt chất B</th><th>Mức độ</th><th>Cảnh báo / khuyến cáo</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="d : ${list}"><td class="fw-semibold" th:text="${d.ingredientA}"></td><td class="fw-semibold" th:text="${d.ingredientB}"></td>
                            <td><span th:class="'badge text-bg-' + (${d.level == 'danger'} ? 'danger' : (${d.level == 'info'} ? 'info' : 'warning'))" th:text="${levels[d.level]} ?: ${d.level}"></span></td>
                            <td class="small" th:text="${d.message}"></td>
                            <td class="text-nowrap"><a th:href="@{/admin/interactions(edit=${d.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                                <form th:action="@{/admin/interactions/{id}/delete(id=${d.id})}" method="post" class="d-inline" data-confirm="Xóa quy tắc?">
                                    <button class="btn btn-sm btn-outline-danger" aria-label="Xóa"><i class="bi bi-trash"></i></button></form></td></tr>
                        <tr th:if="${list.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">Chưa có quy tắc.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <form th:action="${edit != null} ? @{/admin/interactions/{id}(id=${edit.id})} : @{/admin/interactions}" method="post" class="card">
                <div class="card-header" th:text="${edit != null} ? 'Sửa quy tắc' : 'Thêm quy tắc tương tác'"></div>
                <div class="card-body">
                    <div class="mb-3"><label class="form-label" for="dA">Hoạt chất A (từ khóa)</label><input id="dA" name="ingredient_a" class="form-control" list="ingList" th:value="${edit != null} ? ${edit.ingredientA} : ''" required></div>
                    <div class="mb-3"><label class="form-label" for="dB">Hoạt chất B (từ khóa)</label><input id="dB" name="ingredient_b" class="form-control" list="ingList" th:value="${edit != null} ? ${edit.ingredientB} : ''" required></div>
                    <div class="mb-3"><label class="form-label" for="dL">Mức độ</label>
                        <select id="dL" name="level" class="form-select"><option th:each="e : ${levels}" th:value="${e.key}" th:selected="${(edit != null ? edit.level : 'warning') == e.key}" th:text="${e.value}"></option></select></div>
                    <div class="mb-3"><label class="form-label" for="dM">Nội dung cảnh báo</label><textarea id="dM" name="message" class="form-control" rows="3" required maxlength="500" th:text="${edit != null} ? ${edit.message} : ''"></textarea></div>
                    <button class="btn btn-primary">Lưu</button> <a th:if="${edit != null}" th:href="@{/admin/interactions}" class="btn btn-link">Hủy</a>
                    <datalist id="ingList"><option th:each="i : ${ingredients}" th:value="${i}"></option></datalist>
                </div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
