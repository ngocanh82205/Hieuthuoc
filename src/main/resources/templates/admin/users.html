<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
    <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
        <div></div>
        <a th:href="@{/admin/users/create}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Thêm nhân viên</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Nhân viên</th><th>Chức vụ</th><th>CCHN</th><th class="text-end">Đơn thuốc đã duyệt</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody>
                <tr th:each="u : ${staff}" th:class="${u.locked} ? 'text-muted' : ''">
                    <td><div class="fw-semibold"><th:block th:text="${u.fullName}"/> <span th:if="${u.isOnline()}" class="text-success" title="Đang online">●</span></div>
                        <div class="small text-muted" th:text="${u.email} + (${u.phone != null} ? ' · ' + ${u.phone} : '')"></div></td>
                    <td class="small" th:text="${u.positionLabel()}"></td>
                    <td class="small" th:text="${u.licenseNo} ?: '-'"></td>
                    <td class="text-end" th:text="${@h.num(rxCount.getOrDefault(u.id, 0L))}"></td>
                    <td><span th:if="${u.locked}" class="badge text-bg-secondary">Đã khóa</span><span th:unless="${u.locked}" class="badge text-bg-success">Hoạt động</span></td>
                    <td class="text-nowrap">
                        <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                        <th:block th:if="${u.id != currentUser.id}">
                            <form th:action="@{/admin/users/{id}/lock(id=${u.id})}" method="post" class="d-inline" th:data-confirm="(${u.locked} ? 'Mở khóa' : 'Khóa') + ' tài khoản ' + ${u.fullName} + '?'">
                                <button th:class="'btn btn-sm btn-outline-' + (${u.locked} ? 'success' : 'danger')" th:text="${u.locked} ? 'Mở khóa' : 'Khóa'"></button></form>
                            <form th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post" class="d-inline" th:data-confirm="'Đặt lại mật khẩu cho ' + ${u.fullName} + '?'">
                                <button class="btn btn-sm btn-light" title="Đặt lại mật khẩu" aria-label="Đặt lại mật khẩu"><i class="bi bi-key"></i></button></form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline" th:data-confirm="'Xóa vĩnh viễn nhân viên ' + ${u.fullName} + '?'">
                                <button class="btn btn-sm btn-light text-danger" title="Xóa" th:aria-label="'Xóa ' + ${u.fullName}"><i class="bi bi-trash"></i></button></form>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
